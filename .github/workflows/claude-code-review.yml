name: Claude Code Review

on:
  # We use `pull_request_target` rather than `pull_request` so that the
  # review can reach the `ANTHROPIC_API_KEY` secret even on pull
  # requests from forks (`pull_request` withholds secrets from fork
  # runs, leaving no key to review with). Both the workflow definition
  # and the checkout below come from the base branch, so no untrusted
  # code ever runs here; what Claude reads is the pull request's diff,
  # fetched through `gh`. That is still attacker-authored text reaching
  # a job that holds a secret and a write token, so the
  # `approve-fork-pr` job holds every fork run for maintainer approval
  # first; see its comment for the full model.
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

# Every push to a PR triggers a fresh review run, so pushes that land
# in quick succession pile up several concurrent reviews of which all
# but the newest look at outdated code. Cancel the superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # External fork pull requests run with `pull_request_target`, which
  # grants our secrets and a read/write token to a review of code
  # written by someone with no access to this repository. Two things
  # follow. A review agent reading an attacker-authored diff is a
  # prompt-injection surface: instructions planted in the diff could
  # steer it into posting misleading comments under our token. And
  # anyone able to open pull requests can otherwise spend our Anthropic
  # API budget at will. Hold every fork run here until a maintainer has
  # read the pull request and approved the `fork-pr-ci` environment.
  # Same-repo pull requests (from people who already have write access)
  # are already trusted, so this job is skipped and the review proceeds
  # with no approval step. `claude-review` `needs` this one, so no
  # fork's diff reaches Claude before the approval clears.
  #
  # SETUP REQUIRED: the `fork-pr-ci` environment must exist in the
  # repository settings with "Required reviewers" configured. Without
  # that protection rule this job passes immediately and provides no
  # checkpoint at all.
  approve-fork-pr:
    name: Approve fork PR review
    if: >-
      ${{ github.event.pull_request.head.repo.full_name
          != github.repository }}
    runs-on: ubuntu-latest
    environment: fork-pr-ci
    steps:
      - name: Await maintainer approval
        run: echo "A maintainer approved reviewing this fork PR."

  claude-review:
    # Runs only after `approve-fork-pr` clears (or is skipped for a
    # trusted run); see that job.
    needs: approve-fork-pr
    if: >-
      ${{ !cancelled() &&
          (needs.approve-fork-pr.result == 'success' ||
           needs.approve-fork-pr.result == 'skipped') }}
    runs-on: ubuntu-latest
    # A normal review finishes well inside half an hour. Without an
    # explicit cap the job inherits GitHub's 6-hour default, so a
    # runaway review (e.g. one that fans out subagents without ever
    # converging) burns six hours of runner and API time before the
    # platform kills it. Bound it well above the normal case but far
    # below that ceiling; this is the hard backstop, with `--max-turns`
    # below as a softer secondary guard.
    timeout-minutes: 30
    permissions:
      contents: read
      # `pull-requests: write` (not `read`) is required for the
      # `--comment` flow below to post inline review comments. With
      # only `read`, the action's comment-posting tool is denied and
      # the review silently surfaces nothing on the PR.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout base ref
        uses: actions/checkout@v4
        with:
          # No `ref:`, so this is the base branch. Under
          # `pull_request_target` the job holds the base repository's
          # secrets, so checking out the pull request's head here would
          # hand a fork's `.claude/` configuration, hooks, and
          # `CLAUDE.md` control over a privileged job. The review does
          # not need it: it reads the pull request through `gh pr diff`
          # and `gh pr view`, and uses this checkout only for repository
          # context and for the `CLAUDE.md` files it judges compliance
          # against — which we want taken from the base branch anyway,
          # so a pull request cannot rewrite the rules it is judged by.
          persist-credentials: false
          fetch-depth: 1

      - name: Compute output-token budget from PR size
        id: budget
        # `CLAUDE_CODE_MAX_OUTPUT_TOKENS` caps a single model response,
        # so a large diff wants more room for a complete writeup while a
        # tiny one needs little. Scale it with the diff size. GitHub
        # Actions expressions can't do arithmetic, so add the counts in
        # bash. This bounds response length, not run time; the job's
        # `timeout-minutes` and the review's `--max-turns` bound time.
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          changed=$(( ADDITIONS + DELETIONS ))
          if [ "${changed}" -lt 200 ]; then
            tokens=32000
          elif [ "${changed}" -lt 1000 ]; then
            tokens=64000
          else
            tokens=128000
          fi
          echo "Changed lines: ${changed} -> max output tokens: ${tokens}"
          echo "tokens=${tokens}" >> "${GITHUB_OUTPUT}"

      - name: Run Claude Code Review
        id: claude-review
        # Under `pull_request_target` the workflow definition always
        # comes from the base branch, so a pull request that edits this
        # file is still reviewed by the version already on `main`; the
        # edit only takes effect once merged.
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.budget.outputs.tokens }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without a token here the action mints one by exchanging a
          # GitHub OIDC token for a Claude GitHub App token, and that
          # exchange refuses tokens minted for `pull_request_target`
          # runs, failing the job with "Invalid OIDC token" (see
          # anthropics/claude-code-action#713). Supplying a token skips
          # the exchange; the job's `pull-requests: write` is all the
          # inline comments need.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # Pass `--comment` so findings post as inline PR comments;
          # without it the review runs but surfaces nothing on the PR.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # In agent mode the action only starts the
          # `github_inline_comment` MCP server when the
          # `mcp__github_inline_comment__create_inline_comment` tool is
          # named in `--allowedTools` here; the plugin's own
          # `allowed-tools` frontmatter does not count. Without this,
          # the tool Claude must use to post inline review comments
          # does not exist, so any review that finds issues fails to
          # post them (it falls back to denied `gh api` calls and gives
          # up). The rest of the list matters too: in CI there is no
          # human to approve a tool call, so every tool not named here
          # is silently denied. The list therefore contains every tool
          # the plugin's `allowed-tools` frontmatter asks for, plus the
          # read-only `git` commands the review's subagents use to
          # gather context about the code they are reviewing.
          # `--max-turns` bounds how many agent turns the review may
          # take, a softer guard against a review that fans out without
          # converging (the job's `timeout-minutes` is the hard
          # backstop). Set well above a normal review's turn count so it
          # never truncates real work, only catches runaways.
          claude_args: |
            --max-turns 80
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh search:*),Bash(git blame:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"
          # The full execution transcript (tool calls included) lets a
          # broken run be debugged from the workflow log alone. The
          # transcript may quote repository code and the pull request's
          # diff, which is fine: both are already public, and Actions
          # masks secret values in the log.
          show_full_output: "true"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options.

      - name: Fail if the review errored or was denied posting comments
        # The action fails the step only when it throws (e.g. a crash
        # or bad auth). A run that completes but is broken still exits
        # 0, so two failure modes would otherwise pass as a green
        # check: a review that errored partway (e.g. it hit the
        # output-token limit and produced a truncated result), and a
        # review that was denied the tools it needs to post its
        # findings, so it finished without surfacing anything on the
        # PR. We inspect the execution log for both and fail the job,
        # leaving the throw cases to the action.
        #
        # Only denials of the comment-posting tools fail the job. The
        # review's subagents routinely attempt tool calls outside the
        # `--allowedTools` list above; each such call is denied, the
        # subagent works on with the tools it does have, and the
        # review still posts its findings. A denial of some other
        # tool therefore says nothing about whether the findings made
        # it onto the PR. All denials are printed to the log to help
        # debug runs that behaved unexpectedly.
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          # If the action short-circuited, there is no execution log
          # to inspect; nothing to check.
          if [ -z "${EXECUTION_FILE}" ] || [ ! -f "${EXECUTION_FILE}" ]; then
            echo "No execution log to inspect; skipping."
            exit 0
          fi
          errored=$(jq '[.[] | select(.type == "result") | .is_error] | any' "${EXECUTION_FILE}")
          echo "All permission denials in this run:"
          jq '[.[] | select(.type == "result") | (.permission_denials // [])[]]' "${EXECUTION_FILE}"
          # Match `gh pr comment` only as a whole subcommand (followed by
          # whitespace or end of string), not as a substring.
          posting_denials=$(jq '
            [.[] | select(.type == "result") | (.permission_denials // [])[]
             | select(
                 .tool_name == "mcp__github_inline_comment__create_inline_comment"
                 or (.tool_name == "Bash"
                     and ((.tool_input.command // "")
                          | test("gh pr comment( |$)"))))]
            | length' "${EXECUTION_FILE}")
          if [ "${errored}" = "true" ]; then
            echo "::error::Claude Code Review reported an error (is_error=true). See the review step log above."
            exit 1
          fi
          if [ "${posting_denials}" -gt 0 ]; then
            echo "::error::Claude Code Review was denied ${posting_denials} attempt(s) to post its review comments, so its findings may not have made it onto the PR. Check that the comment-posting tools are in the action's 'claude_args' --allowedTools list and that the workflow's token has the permissions they need (notably 'pull-requests: write')."
            exit 1
          fi
          echo "Review completed cleanly: no errors, and no denials of comment-posting tools."
