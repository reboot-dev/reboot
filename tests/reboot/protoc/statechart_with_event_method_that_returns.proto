syntax = "proto3";

import "rbt/v1alpha1/options.proto";
import "tests/reboot/protoc/shared.proto";

package tests.reboot.protoc;

message Echo {
  option (rbt.v1alpha1.state) = {
  };
  option (rbt.v1alpha1.statechart) = {
    // TESTS: the rpc of an event method of a statechart must be a
    //        writer that takes the event and returns
    //        `google.protobuf.Empty`.
    events: "tests.reboot.protoc.Text"
    event_methods { method: "reply" event: "tests.reboot.protoc.Text" }
    initial: "QUIET"
    states {
      name: "QUIET"
      transitions { on { event: "tests.reboot.protoc.Text" to: "LOUD" } }
    }
    states { name: "LOUD" }
  };
  Text last_message = 1;
}

service EchoMethods {
  rpc Reply(Text) returns (Text) {
    option (rbt.v1alpha1.method).writer = {
    };
  }
}
