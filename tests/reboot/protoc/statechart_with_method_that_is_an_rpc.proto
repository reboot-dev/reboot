syntax = "proto3";

import "rbt/v1alpha1/options.proto";
import "tests/reboot/protoc/shared.proto";

package tests.reboot.protoc;

message Echo {
  option (rbt.v1alpha1.state) = {
  };
  option (rbt.v1alpha1.statechart) = {
    // TESTS: a method that a statechart names must not also be what an
    //        rpc of the state is as a method.
    events: "tests.reboot.protoc.Text"
    initial: "QUIET"
    states {
      name: "QUIET"
      transitions {
        on {
          event: "tests.reboot.protoc.Text"
          guard { inline { method: "reply" } }
          to: "LOUD"
        }
      }
    }
    states { name: "LOUD" }
  };
  Text last_message = 1;
}

service EchoMethods {
  rpc Reply(Text) returns (Text) {
    option (rbt.v1alpha1.method).writer = {
    };
  }
}
