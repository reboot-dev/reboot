syntax = "proto3";

import "rbt/v1alpha1/options.proto";
import "tests/reboot/protoc/shared.proto";

package tests.reboot.protoc;

message Echo {
  option (rbt.v1alpha1.state) = {
  };
  option (rbt.v1alpha1.statechart) = {
    // TESTS: an event of a statechart must be the full name of a
    //        message.
    events: "tests.reboot.protoc.Shouted"
    initial: "QUIET"
    states {
      name: "QUIET"
      transitions { on { event: "tests.reboot.protoc.Shouted" to: "LOUD" } }
    }
    states { name: "LOUD" }
  };
  Text last_message = 1;
}

service EchoMethods {
  rpc Reply(Text) returns (Text) {
    option (rbt.v1alpha1.method).writer = {
    };
  }
}
