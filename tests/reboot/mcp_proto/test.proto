syntax = "proto3";

package tests.reboot.mcp_proto;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "rbt/v1alpha1/options.proto";

// A state defined in proto whose methods are MCP tools and resources.
message Note {
  option (rbt.v1alpha1.state) = {
  };

  repeated string lines = 1;
  map<string, string> labels = 2;
  Priority priority = 3;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  LOW = 1;
  HIGH = 2;
}

message AppendRequest {
  string text = 1;
  int32 times = 2;
  repeated string tags = 3;
  map<string, string> labels = 4;
  Priority priority = 5;
}

message AppendResponse {
  int32 count = 1;
}

message GetRequest {}

message GetResponse {
  repeated string lines = 1;
  map<string, string> labels = 2;
  Priority priority = 3;
}

message Author {
  string name = 1;
}

// A request and a response with the same fields, so that the
// response shows what the method received.
message EchoRequest {
  Author author = 1;
  repeated Author reviewers = 2;
  map<string, Author> editors = 3;
  google.protobuf.Timestamp when = 4;
  google.protobuf.Duration took = 5;
  google.protobuf.Value extra = 6;
  google.protobuf.Struct metadata = 7;
  google.protobuf.Int32Value rating = 8;
  bytes data = 9;
}

message EchoResponse {
  Author author = 1;
  repeated Author reviewers = 2;
  map<string, Author> editors = 3;
  google.protobuf.Timestamp when = 4;
  google.protobuf.Duration took = 5;
  google.protobuf.Value extra = 6;
  google.protobuf.Struct metadata = 7;
  google.protobuf.Int32Value rating = 8;
  bytes data = 9;
}

message LineRequest {
  int32 index = 1;
}

message LineResponse {
  string line = 1;
}

service NoteMethods {
  rpc Append(AppendRequest) returns (AppendResponse) {
    option (rbt.v1alpha1.method) = {
      writer: {},
      mcp: { tool: true },
    };
  }

  rpc Get(GetRequest) returns (GetResponse) {
    option (rbt.v1alpha1.method) = {
      reader: {},
      mcp: { tool: true, resource: true },
    };
  }

  rpc Echo(EchoRequest) returns (EchoResponse) {
    option (rbt.v1alpha1.method) = {
      reader: {},
      mcp: { tool: true },
    };
  }

  rpc Line(LineRequest) returns (LineResponse) {
    option (rbt.v1alpha1.method) = {
      reader: {},
      mcp: { resource: true },
    };
  }
}
