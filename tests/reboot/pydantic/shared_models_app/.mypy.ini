# A mypy configuration file, as documented here:
#   https://mypy.readthedocs.io/en/stable/config_file.html

[mypy]
# Tell us if we're misspelling one of the configuration keys below.
warn_unused_configs = True

# Find modules in our source tree. The shared models live in `api/`
# only, while an API's package is split between `api/` and the code
# generated into `backend/api/`.
mypy_path = api:backend/src:backend/api:backend/tests
# Since `protoc` doesn't generate `__init__.py` files, we must tell
# mypy to treat the `mypy_path` entries as the explicit bases for our
# packages. See:
#   https://mypy.readthedocs.io/en/stable/running_mypy.html#mapping-file-paths-to-modules
explicit_package_bases = True

check_untyped_defs = True
strict_equality = True

[mypy-google.api.*]
ignore_missing_imports = True

[mypy-google.rpc.*]
ignore_missing_imports = True

[mypy-grpc.*]
ignore_missing_imports = True

[mypy-grpc_status.*]
ignore_missing_imports = True

# The generated code of an API doesn't type check itself yet, but
# code that uses it is still checked against its types.
[mypy-store.v1.*]
ignore_errors = True

[mypy-warehouse.v1.*]
ignore_errors = True
