syntax = "proto3";

package tests.reboot.bdd;

import "rbt/v1alpha1/options.proto";
import "rbt/v1alpha1/tasks.proto";

// A bank account, used to test the `reboot.bdd` steps.
message Account {
  option (rbt.v1alpha1.state) = {
  };
  int64 balance = 1;
  Owner owner = 2;
  map<string, Owner> owners = 3;
}

// The person an account belongs to.
message Owner {
  string name = 1;
  repeated string tags = 2;
}

service AccountMethods {
  rpc Open(OpenRequest) returns (OpenResponse) {
    option (rbt.v1alpha1.method).writer = {
      constructor: {},
    };
  }

  rpc Balance(BalanceRequest) returns (BalanceResponse) {
    option (rbt.v1alpha1.method).reader = {
    };
  }

  rpc DepositLater(DepositLaterRequest) returns (DepositLaterResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }

  rpc Whoami(WhoamiRequest) returns (WhoamiResponse) {
    option (rbt.v1alpha1.method).reader = {
    };
  }

  rpc SetOwner(SetOwnerRequest) returns (SetOwnerResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }

  rpc GetOwner(GetOwnerRequest) returns (GetOwnerResponse) {
    option (rbt.v1alpha1.method).reader = {
    };
  }

  rpc PutOwner(PutOwnerRequest) returns (PutOwnerResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }

  rpc GetOwners(GetOwnersRequest) returns (GetOwnersResponse) {
    option (rbt.v1alpha1.method).reader = {
    };
  }

  rpc Deposit(DepositRequest) returns (DepositResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }

  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse) {
    option (rbt.v1alpha1.method) = {
      writer: {},
      errors: [ "OverdraftError" ],
    };
  }
}

message OpenRequest {
  int64 initial_balance = 1;
}

message OpenResponse {
  // ID of the newly opened account.
  string account_id = 1;
}

message BalanceRequest {}

message DepositLaterRequest {
  // Amount a scheduled task will deposit.
  int64 amount = 1;
}

message DepositLaterResponse {
  // ID of the scheduled deposit task.
  rbt.v1alpha1.TaskId task_id = 1;
}

message WhoamiRequest {}

message WhoamiResponse {
  // ID of the authenticated caller; empty when anonymous.
  string user_id = 1;
}

message SetOwnerRequest {
  Owner owner = 1;

  // Owners in addition to `owner`.
  repeated Owner co_owners = 2;
}

message SetOwnerResponse {}

message GetOwnerRequest {}

message GetOwnerResponse {
  Owner owner = 1;
}

message PutOwnerRequest {
  string key = 1;
  Owner owner = 2;
}

message PutOwnerResponse {}

message GetOwnersRequest {}

message GetOwnersResponse {
  map<string, Owner> owners = 1;
}

message BalanceResponse {
  int64 balance = 1;
}

message DepositRequest {
  int64 amount = 1;
}

message DepositResponse {
  int64 updated_balance = 1;
}

message WithdrawRequest {
  int64 amount = 1;
}

message WithdrawResponse {
  int64 updated_balance = 1;
}

// Error returned when a withdrawal would overdraft the account.
message OverdraftError {
  // Amount the withdrawal would have overdrafted the account by.
  int64 amount = 1;
}
