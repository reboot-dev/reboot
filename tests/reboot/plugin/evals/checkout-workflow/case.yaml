schema_version: "1.1"
name: checkout-workflow
description: "Work that calls outside systems and must survive a restart is a durable workflow, with each external call guarded."
tags: [workflow, code]
runs: 3
execution:
  prompt: "Add checkout to a small shop app on Reboot. When a customer checks out an order, charge their card with Stripe, then email them a receipt with Mailgun. Checkout has to finish even if the server restarts halfway through, and must never charge anyone twice. Write the API in `api/shop/v1/order.py`, and all the backend code for orders and checkout, the Stripe charge and the receipt email included, in `backend/src/servicers/order.py`."
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  append_system_prompt: "This session can read files, load skills, and write and edit files in the working directory. It cannot run commands, so nothing is generated, installed, tested or started. No one will answer questions in this session: where you would ask, choose, say what you chose, and go on. Do the work the request asks for and write its files."
graders:
  - name: reboot-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"reboot:[\w-]+"'
  - name: workflow-is-classmethod
    type: regex
    target: { source: file, path: backend/src/servicers/order.py }
    pattern: '@classmethod\s*\n\s*async\s+def'
  - name: guarded-external-calls
    type: llm
    focus: { source: file, path: backend/src/servicers/order.py }
    criteria: "PASS if checkout runs as a Reboot `Workflow` method and both outside effects are safe when the workflow replays after a crash. The Stripe charge passes if it runs inside `at_least_once(...)` with a Stripe idempotency key that is the same on every replay: built from stable inputs (the order's state id, and perhaps an attempt number kept in state for a customer's new checkout), or generated once in an `at_least_once(...)` step of its own and reused by the charge. It also passes inside `at_most_once(...)` if the code catches `AtMostOnceFailedBeforeCompleting` around that call and records or reports that the charge is unresolved. The receipt email passes if it is sent with Reboot's Mailgun library (`Message.send` from `reboot.thirdparty.mailgun`, a Reboot call that needs no `at_least_once`), or by a call to Mailgun's HTTP API inside `at_least_once(...)` or `at_most_once(...)` with an alias of its own. FAIL if checkout is a `Writer` or `Transaction` that calls Stripe or Mailgun's HTTP API, if the Stripe call or a call to Mailgun's HTTP API is awaited directly in the workflow outside those primitives, if the charge runs under `at_least_once` with no idempotency key or with one made inside the charging callable from `uuid4()` or the current time, or if the charge runs under `at_most_once` and nothing catches `AtMostOnceFailedBeforeCompleting`. Checking with Stripe before charging, a writer that starts the workflow, and helper functions in the same file are all fine. Quote the code you relied on."
