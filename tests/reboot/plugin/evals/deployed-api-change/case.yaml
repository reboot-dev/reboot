schema_version: "1.1"
name: deployed-api-change
description: "A rule check, not a deploy: told the app is deployed, the agent changes the API additively (a renamed field keeps its tag; an unwanted field stays declared), as Reboot's schema-evolution rule requires."
tags: [api, schema-evolution, code]
runs: 3
execution:
  prompt: "Our task tracker is live on Reboot Cloud with real users' tasks in it. Rename the task's `priority` field to `urgency`, and get rid of the `notes` field: nobody uses it. Make the change."
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  append_system_prompt: "This session can read files, load skills, and write and edit files in the working directory, which holds the app. It cannot run commands, so nothing is generated, installed, tested, started or deployed. No one will answer questions in this session: where you would ask, choose, say what you chose, and go on. Do the work the request asks for and write its files."
context:
  scaffold_script: fixture.sh
graders:
  - name: reboot-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"reboot:[\w-]+"'
  - name: urgency-keeps-tag-2
    type: regex
    target: { source: file, path: api/tasks/v1/task.py }
    pattern: 'urgency\s*:\s*int\s*=\s*Field\(\s*tag\s*=\s*2\b'
  - name: tag-3-still-declared
    type: regex
    target: { source: file, path: api/tasks/v1/task.py }
    pattern: ':\s*str\s*=\s*Field\(\s*tag\s*=\s*3\b'
  - name: additive-change
    type: llm
    focus: { source: file, path: api/tasks/v1/task.py }
    criteria: "This is the task tracker's API file after the change. Before it, `TaskState` had `title: str` (tag 1), `priority: int` (tag 2), `notes: str` (tag 3) and `done: bool` (tag 4), and `EditRequest`, the request of both `create` and `edit`, had `title: str` (tag 1), `priority: int` (tag 2) and `notes: str` (tag 3). Reboot refuses a deployed app whose state or request model lost a field or changed a field's tag or type. PASS if `TaskState` now has `urgency: int` with tag 2 in place of `priority`; a `str` field with tag 3 is still declared in `TaskState` (named `notes` or renamed, for example as deprecated); `EditRequest` still declares an `int` field with tag 2 and a `str` field with tag 3, under their old names or new ones; and no other field's tag or type changed. FAIL if tag 3 is gone from `TaskState` or `EditRequest`, if tag 2 is gone from `EditRequest`, if `urgency` has a tag other than 2 or a type other than `int`, if a kept tag now belongs to a field of another type, or if `priority` is still in `TaskState` with `urgency` added beside it under a new tag. Quote the `TaskState` and `EditRequest` you relied on."
