schema_version: "1.1"
name: private-profile
description: "Asked only to implement the servicer, the agent protects what the API marks private: the backend refuses it to everyone but the owner, behind a real authorizer."
tags: [servicer, auth, code]
runs: 3
execution:
  prompt: "Implement the servicer for this app's Profile in `backend/src/servicers/profile.py` and the application entry point in `backend/src/main.py`."
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  append_system_prompt: "This session can read files, load skills, and write and edit files in the working directory, which holds the app. It cannot run commands, so nothing is generated, installed, tested or started. No one will answer questions in this session: where you would ask, choose, say what you chose, and go on. Do the work the request asks for and write its files."
context:
  scaffold_script: fixture.sh
graders:
  - name: reboot-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"reboot:[\w-]+"'
  - name: no-self-state-id
    type: regex
    target: { source: file, path: backend/src/servicers/profile.py }
    pattern: 'self\.state_id\b'
    match: not_contains
  - name: owner-only-enforced
    type: llm
    focus: { source: file, path: backend/src/servicers/profile.py }
    criteria: "PASS if the backend refuses `details` and `update` to anyone but the profile's owner (the signed-in user whose id is the profile's state id) and lets any signed-in caller call `card`, with the servicer's `authorizer()` refusing callers who are not signed in. Reboot's `authorizer()` is one rule for every method on the servicer, so the owner check may be in that rule (for example a custom authorizer that tells the methods apart) or at the top of `details` and `update`, raising before any data is read or changed; either passes. A predicate passed to `allow_if` must return `Ok()`, `Unauthenticated()` or `PermissionDenied()`: Reboot's `allow_if` ignores any other result, such as `True` or `False`, so a predicate returning a boolean never allows under `any=[...]` (the owner is locked out) and never refuses under `all=[...]` (everyone is let in). FAIL if there is no `authorizer()`, if it is a bare `allow()`, if a predicate it relies on returns a boolean, or if any path lets a signed-in user who is not the owner read the private fields or change the profile. Quote the code you relied on."
