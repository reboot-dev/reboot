syntax = "proto3";
package reactive.v1;
import "rbt/v1alpha1/options.proto";
message Counter { option (rbt.v1alpha1.state) = { implements: ["reactive.v1.CounterMethods"] }; int64 value = 1; string next = 2; }
message Empty {}
message Select { string next = 1; }
message Add { int64 amount = 1; bool fail = 2; }
message Value { int64 value = 1; bytes padding = 2; }
message Refused { int64 value = 1; }
service CounterMethods {
 option (rbt.v1alpha1.service) = {state: "reactive.v1.Counter"};
 rpc Create(Empty) returns (Empty) { option (rbt.v1alpha1.method) = {writer: {constructor: {}}}; }
 rpc Increment(Add) returns (Value) { option (rbt.v1alpha1.method) = {writer: {} errors: ".reactive.v1.Refused"}; }
 rpc SelectNext(Select) returns (Empty) { option (rbt.v1alpha1.method) = {writer: {}}; }
 rpc Query(Empty) returns (Value) { option (rbt.v1alpha1.method) = {reader: {}}; }
 rpc Refuse(Empty) returns (Value) { option (rbt.v1alpha1.method) = {reader: {} errors: ".reactive.v1.Refused"}; }
}
