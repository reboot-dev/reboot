[package]
name = "generated-sorted-map-prerequisite-app"
version = "0.0.0"
edition = "2024"
publish = false
[build-dependencies]
reboot = { package = "reboot-rust-schema", path = "../../../", features = ["build"] }
[dependencies]
reboot = { package = "reboot-rust-schema", path = "../../../", features = ["build"] }
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
uuid = { version = "1", features = ["v4"] }
