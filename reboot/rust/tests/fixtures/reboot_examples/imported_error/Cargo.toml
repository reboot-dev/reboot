[package]
name = "reboot-rust-imported-error-proof"
version = "0.0.0"
edition = "2024"
publish = false
[build-dependencies]
reboot = { package = "reboot-rust-schema", path = "../../../../", features = ["build"] }
[dependencies]
reboot = { package = "reboot-rust-schema", path = "../../../../", features = ["build"] }
prost = "0.13"
prost-types = "0.13"
uuid = { version = "1", features = ["v4"] }
tonic = "0.12"
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "time"] }
