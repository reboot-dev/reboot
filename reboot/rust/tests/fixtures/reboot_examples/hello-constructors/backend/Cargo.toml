[package]
name = "upstream-hello-constructors"
version = "0.0.0"
edition = "2024"
publish = false
[[bin]]
name = "app"
path = "src/main.rs"
[[bin]]
name = "client"
path = "src/bin/client.rs"
[dependencies]
reboot = { package = "reboot-rust-schema", path = "../../../../../" }
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
tonic-health = "0.12"
uuid = { version = "1", features = ["v4", "v5"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
[build-dependencies]
reboot = { package = "reboot-rust-schema", path = "../../../../../", features = ["build"] }

[dev-dependencies]
reboot = { package = "reboot-rust-schema", path = "../../../../../", features = ["test-support"] }
tokio-stream = { version = "0.1", features = ["net"] }
