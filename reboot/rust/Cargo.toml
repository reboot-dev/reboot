[package]
name = "reboot-rust-schema"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Experimental Rust schema emitter and proto-first client for Reboot"

[lib]
path = "src/lib.rs"

[[bin]]
name = "reboot-rust-schema"
path = "src/main.rs"

[[bin]]
name = "protoc-gen-reboot_rust"
path = "src/bin/protoc-gen-reboot_rust.rs"

[features]
build = ["dep:protoc-bin-vendored", "dep:tonic-build"]
test-support = ["dep:tokio-stream"]

[dependencies]
bytes = "1"
heck = "0.5"
http = "1"
http-body = "1"
http-body-util = "0.1"
prost = "0.13"
prost-types = "0.13"
sha2 = "0.10"
serde_json = "1"
protoc-bin-vendored = { version = "3", optional = true }
tonic = "0.12"
tower = "0.5"
tonic-build = { version = "0.12", optional = true }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["net"], optional = true }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
protoc-bin-vendored = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
