[package]
name = "reboot-rust-schema"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Experimental Rust schema emitter and proto-first client for Reboot"

[lib]
path = "src/lib.rs"

[[bin]]
name = "reboot-rust-schema"
path = "src/main.rs"

[[bin]]
name = "protoc-gen-reboot_rust"
path = "src/bin/protoc-gen-reboot_rust.rs"

[features]
build = ["dep:protoc-bin-vendored", "dep:tonic-build"]
test-support = []

[dependencies]
base64 = "0.22"
axum = "0.7"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
googleapis-tonic-google-rpc = "0.11"
heck = "0.5"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.13"
prost-types = "0.13"
sha1 = "0.10"
sha2 = "0.10"
serde_json = "1"
protoc-bin-vendored = { version = "3", optional = true }
tonic = "0.12"
tonic-health = "0.12"
tonic-reflection = "0.12"
tower = "0.5"
tonic-build = { version = "0.12", optional = true }
uuid = { version = "1", features = ["v4", "v5", "v7"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }


[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
protoc-bin-vendored = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
