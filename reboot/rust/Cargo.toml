[package]
name = "reboot-rust-schema"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Experimental Rust schema emitter and proto-first client for Reboot"

[lib]
path = "src/lib.rs"

[[bin]]
name = "reboot-rust-schema"
path = "src/main.rs"

[[bin]]
name = "protoc-gen-reboot_rust"
path = "src/bin/protoc-gen-reboot_rust.rs"

[dependencies]
heck = "0.5"
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
protoc-bin-vendored = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
