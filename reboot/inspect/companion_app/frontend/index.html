<!-- Placeholder page for the companion application. Its job today is
     to hold `Presence`, so that `rbt dev run` can tell whether anyone
     is looking at a dashboard. The real dashboard replaces this. The
     styling lives here rather than in a stylesheet so the `esbuild`
     step has only the JS bundle to inline; see `inline_bundle.py`. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reboot dashboard</title>
    <style>
      /* Tokens from the Reboot Cloud design system the mockup imports
         (`_ds/reboot-cloud-design-system-.../_ds_bundle.css`), as HSL
         triplets so they compose with `hsl(var(--token) / alpha)` the
         way the source does. Light only: the system has `.dark:`
         utilities but the design never opts in. */
      :root {
        --background: 47 36% 95%;
        --foreground: 211.1 71.7% 22.2%;
        --card: 0 0% 100%;
        --primary: 211 72% 22%;
        --primary-foreground: 355.7 100% 97.3%;
        --secondary: 115 49% 76%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --accent: 166 47% 61%;
        --destructive: 0 84.2% 60.2%;
        --border: 240 5.9% 90%;
        --radius: 0.5rem;

        /* Values the design uses directly, alongside the tokens. */
        --sidebar: 47 30% 92%;
        --border-strong: 240 5.9% 86%;
        --border-soft: 240 5.9% 94%;
        --surface-sunken: 240 4.8% 97%;
        --prose: 211 40% 30%;
        --returns: 166 47% 33%;
        --errors: 0 62% 45%;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: hsl(var(--primary));
        text-decoration: none;
      }
      a:hover {
        color: hsl(166 47% 41%);
      }
      ::selection {
        background: hsl(var(--accent) / 0.35);
      }

      main {
        max-width: 840px;
        margin: 0 auto;
        padding: 40px 48px;
      }

      .muted {
        color: hsl(var(--muted-foreground));
      }

      .error {
        color: hsl(var(--errors));
        background: hsl(var(--destructive) / 0.08);
        border: 1px solid hsl(var(--destructive) / 0.3);
        border-radius: var(--radius);
        padding: 12px 14px;
      }

      .shell {
        display: grid;
        grid-template-columns: 250px 1fr;
        height: 100%;
        overflow: hidden;
      }

      /* --- Sidebar --- */

      nav {
        background: hsl(var(--sidebar));
        border-right: 1px solid hsl(var(--border));
        overflow-y: auto;
        padding: 14px 8px;
      }

      .eyebrow {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: hsl(var(--muted-foreground));
      }

      nav > .eyebrow {
        padding: 0 8px 8px;
      }

      .namespace-head {
        display: grid;
        grid-template-columns: 10px 1fr auto;
        align-items: center;
        gap: 0 7px;
        width: 100%;
        padding: 6px 10px;
        border: none;
        border-radius: 5px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .namespace-head:hover {
        background: hsl(var(--card) / 0.6);
      }

      .caret {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10px;
        color: hsl(240 3.8% 55%);
      }

      .namespace-name {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11.5px;
        font-weight: 600;
      }

      nav a {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 0 8px;
        padding: 5px 10px 5px 34px;
        border-radius: 5px;
        color: inherit;
      }

      nav a:hover {
        background: hsl(var(--card) / 0.6);
        color: inherit;
      }

      .nav-name {
        font-weight: 600;
        font-size: 12.5px;
      }

      .nav-count {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10px;
        color: hsl(var(--muted-foreground));
      }

      /* --- Document pane --- */

      .pane {
        overflow-y: auto;
        background: hsl(var(--background));
      }

      header {
        max-width: 840px;
        margin: 0 auto;
        padding: 40px 48px 28px;
      }

      header h1 {
        font-size: 34px;
        font-weight: 650;
        letter-spacing: -0.02em;
        margin: 6px 0 0;
      }

      .state-type {
        max-width: 840px;
        margin: 0 auto;
        padding: 0 48px 48px;
      }

      .state-type > .eyebrow:first-child {
        display: block;
      }

      .state-type {
        border-top: 1px solid hsl(var(--border-strong));
        padding-top: 36px;
      }

      .state-type h2 {
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.02em;
        margin: 6px 0 4px;
      }

      .file {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11.5px;
        color: hsl(var(--muted-foreground));
      }

      .eyebrow.section {
        margin: 26px 0 10px;
      }

      .empty {
        border: 1px dashed hsl(var(--border-strong));
        border-radius: calc(var(--radius) - 2px);
        padding: 12px 14px;
        font-size: 12.5px;
        color: hsl(var(--muted-foreground));
        line-height: 1.5;
      }

      .fields {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field {
        display: flex;
        align-items: baseline;
        gap: 10px;
        border: 1px solid hsl(240 5.9% 92%);
        border-radius: calc(var(--radius) - 2px);
        padding: 10px 14px;
        background: hsl(var(--card) / 0.6);
      }

      .field-name {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12.5px;
        font-weight: 600;
      }

      .field-type {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11.5px;
        color: hsl(var(--muted-foreground));
      }

      .methods {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .method {
        border: 1px solid hsl(var(--border));
        border-radius: var(--radius);
        background: hsl(var(--card));
        overflow: hidden;
      }

      .method-head {
        padding: 14px 18px 12px;
      }

      .method-title {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .method-name {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 14px;
        font-weight: 600;
      }

      .kind {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 999px;
        background: hsl(var(--muted));
        border: 1px solid hsl(240 5.9% 84%);
      }

      .tag {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 9px;
        padding: 2px 6px;
        border: 1px solid hsl(240 5.9% 84%);
        border-radius: 999px;
        color: hsl(var(--muted-foreground));
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .method-description {
        font-size: 13px;
        line-height: 1.55;
        color: hsl(var(--prose));
        margin: 8px 0 0;
        text-wrap: pretty;
      }

      .method-signature {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px 18px;
        background: hsl(var(--surface-sunken));
        border-top: 1px solid hsl(var(--border-soft));
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11.5px;
        color: hsl(var(--muted-foreground));
      }

      .arrow {
        color: hsl(240 3.8% 65%);
      }
      .returns {
        color: hsl(var(--returns));
      }
      .errors {
        color: hsl(var(--errors));
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
