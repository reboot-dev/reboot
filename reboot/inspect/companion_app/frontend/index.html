<!-- Placeholder page for the companion application. Its job today is
     to hold `Presence`, so that `rbt dev run` can tell whether anyone
     is looking at a dashboard. The real dashboard replaces this. The
     styling lives here rather than in a stylesheet so the `esbuild`
     step has only the JS bundle to inline; see `inline_bundle.py`. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reboot dashboard</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --text: #1c1917;
        --text-muted: #78716c;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0a09;
          --text: #f5f5f4;
          --text-muted: #a8a29e;
        }
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 3rem 1.5rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }

      p {
        color: var(--text-muted);
      }

      code {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;
        font-size: 0.85em;
      }

      strong {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
