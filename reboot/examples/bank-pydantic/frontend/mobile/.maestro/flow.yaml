# Maestro end-to-end flow for the bank-pydantic mobile app.
#
# Drives the real app on a real Android runtime (Hermes), through Expo
# Go, against a running Reboot backend that starts with an empty bank.
# The orchestration script loads the app fresh (`expo start --android`),
# so this flow does not `launchApp`; it drives the foreground app.
# `appId` is Expo Go's package because the app runs inside it.
#
# What it proves: the native OAuth sign-in completes and yields a
# usable session, the signed-in user opens two accounts, and a transfer
# between them round-trips through the backend so the reactive balances
# re-render — i.e. the Reboot client's native reads and mutations
# actually work, carrying the bearer that the OAuth flow produced.
# Assertions target elements by `testID` (see `App.tsx`), not arbitrary
# on-screen text, except inside the sign-in browser tab, which the app
# does not render and so cannot label.
appId: host.exp.exponent
---
# Wait for the app to finish mounting before driving it.
- extendedWaitUntil:
    visible:
      id: "sign-in-button"
    timeout: 30000

# On a fresh Expo Go install, the first project open shows Expo Go's
# onboarding "developer menu" bottom sheet over the app, and its scrim
# swallows taps meant for the app. None of the sheet's elements expose a
# testID, so we match it by the "Bottom Sheet" accessibility label on
# its container — that label is Expo Go's, from the `@gorhom/bottom-sheet`
# React Native library it renders the dev menu with (its container
# defaults `accessibilityLabel` to "Bottom Sheet").
#
# The sheet auto-opens at an unpredictable delay after the project
# loads: Expo Go loads its dev menu from a separate JS bundle, and on a
# slow CI emulator the sheet can trail the app's own interactivity by
# 15+ seconds — long enough to outlast a one-shot conditional check
# (Maestro polls a `runFlow`/`when` condition for at most 7 seconds,
# its `optionalLookupTimeoutMs`) and then swallow a later tap. So
# deterministically wait for the sheet before driving the app,
# tolerating its absence (`optional` keeps the timeout from failing the
# flow), because an already-onboarded Expo Go install never shows it
# again.
- extendedWaitUntil:
    visible: "Bottom Sheet"
    timeout: 30000
    optional: true

# Dismiss the sheet (when it did open) with a downward swipe (the
# library's built-in dismiss gesture): one motion that slides the sheet
# and its scrim away and returns to the app. Then confirm the dismissal
# landed, so a failed swipe surfaces here as a named step instead of as
# a swallowed tap further down the flow.
- runFlow:
    when:
      visible: "Bottom Sheet"
    commands:
      - swipe:
          start: "50%, 65%"
          end: "50%, 95%"
      - extendedWaitUntil:
          notVisible: "Bottom Sheet"
          timeout: 10000
- waitForAnimationToEnd

# The app loads signed out.
- assertVisible: "Rebank"

# Sign in. Tapping "Sign in" hands off to an in-app browser tab on the
# backend's OAuth server, so the next steps drive Chrome rather than
# the app: the tab belongs to a different package, but Maestro matches
# against whatever is on screen, so plain text selectors reach it.
#
# The tab goes straight to the `Development` provider's fake account
# picker, with no consent screen on the way: `main.py` claims this
# app's redirect URI through `Application(native_redirect_uris=...)`,
# and Expo Go's development redirect URI is trusted automatically
# under `rbt dev run`. The picker is served by the backend, not the
# app, hence no testIDs to target.
- tapOn:
    id: "sign-in-button"

# Pick a fixed identity so the run is reproducible. The user id behind
# it is derived from the app's root keys, so it is not predictable
# here — only the display name is. Chrome's first run can put its own
# onboarding in front of the page, so wait generously.
- extendedWaitUntil:
    visible: "Alice"
    timeout: 60000
- tapOn: "Alice"

# The redirect closes the tab and returns to the app, which exchanges
# the authorization code for tokens and re-renders signed in.
# Auto-construction of the user's `User` signs them up as a bank
# customer along the way, so the signed-in view is ready to use.
- extendedWaitUntil:
    visible:
      id: "signed-in-as"
    timeout: 60000

# Open the signed-in user's first account with a $1000 initial deposit.
# To dismiss the soft keyboard after typing we tap the field's `Label`
# (a plain, non-pressable `Text`) rather than `hideKeyboard`. On Android
# `hideKeyboard` issues a Back press, and in Expo Go a Back press pops
# the loaded project back to Expo Go's home screen, unloading the app.
# The app's `ScrollView` uses React Native's default
# `keyboardShouldPersistTaps="never"`, so a tap on a non-input child
# dismisses the keyboard (and is swallowed); if the keyboard is already
# down it is a harmless no-op. We then `waitForAnimationToEnd` so the
# keyboard finishes sliding away before the next tap: that same
# dismissal otherwise races and swallows the very next tap meant for a
# button, flakily dropping the mutation it would have fired.
- tapOn:
    id: "initial-deposit-input"
- inputText: "1000"
- tapOn:
    id: "initial-deposit-label"
- waitForAnimationToEnd
- tapOn:
    id: "open-account-button"

# Wait for the account to land before opening the next one: the
# transfer pickers are a reactive read of `useBalances`, and each
# account's chip appears once its `openAccount` has landed. The chips
# are addressed by the position of their account in the user's list, so
# `transfer-from-0` appearing confirms the first account exists.
- scrollUntilVisible:
    element:
      id: "transfer-from-0"
    direction: DOWN

# Open a second account with a $500 initial deposit, so there is
# somewhere to transfer to.
- scrollUntilVisible:
    element:
      id: "initial-deposit-input"
    direction: UP
- tapOn:
    id: "initial-deposit-input"
- inputText: "500"
- tapOn:
    id: "initial-deposit-label"
- waitForAnimationToEnd
- tapOn:
    id: "open-account-button"
- scrollUntilVisible:
    element:
      id: "transfer-from-1"
    direction: DOWN

# Transfer $100 from the first account to the second.
# `scrollUntilVisible` brings each control into view before tapping it;
# the form is taller than the viewport.
- tapOn:
    id: "transfer-from-0"
- scrollUntilVisible:
    element:
      id: "transfer-to-1"
    direction: DOWN
- tapOn:
    id: "transfer-to-1"
- scrollUntilVisible:
    element:
      id: "transfer-amount-input"
    direction: DOWN
- tapOn:
    id: "transfer-amount-input"
- inputText: "100"
- tapOn:
    id: "transfer-amount-label"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "transfer-button"
    direction: DOWN
- tapOn:
    id: "transfer-button"

# The reactive balances re-render. Accounts also accrue $1 of interest
# every few seconds (see `account_servicer.py`), so the exact amount
# drifts upward — assert the hundreds range, not an exact value. After
# the transfer the first account is in the $900s ($1000 - $100) and the
# second in the $600s ($500 + $100); neither was in those ranges
# beforehand, so this also confirms the transfer landed.
- scrollUntilVisible:
    element:
      id: "account-balance"
      text: "\\$9\\d\\d"
    direction: DOWN
# The second account's row is below the first in the table, so scroll
# to it too.
- scrollUntilVisible:
    element:
      id: "account-balance"
      text: "\\$6\\d\\d"
    direction: DOWN
