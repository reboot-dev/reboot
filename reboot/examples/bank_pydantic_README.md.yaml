name: Bank (Pydantic)
repo_name: reboot-bank-pydantic
overview: |
  This repository contains an example bank ("Rebank") written using
  Reboot, with its API defined using Pydantic models.
backend_locations: "`backend/`"
backend_language: python
has_frontend: true
has_non_react_frontend: false
has_mcp: true
has_mobile: true
has_tests: true
has_cloud: false
web_sign_in_notes: |
  The web app requires signing in. In development, click "Sign in" and
  pick (or make up) a `Development` identity. Signing in auto-constructs
  your `User`, which signs you up as a customer of the bank (see
  `backend/src/user_servicer.py`), so the web app shows only your own
  accounts. The web app and the MCP surface share sign-on: signing in on
  one signs you in on the other.

  The mobile app signs in too, against the same OAuth server, and with
  the same `useSignIn()` / `useSignOut()` / `useUser()` hooks. It cannot
  use the browser-redirect flow the web app uses — React Native has no
  page to redirect and no cookie jar to hold the session — so it builds
  an auth object with `expoAuth({...})` from
  `@reboot-dev/reboot-react/native` and passes it to its
  `RebootClientProvider` as `nativeAuth`, and Reboot runs the standard
  authorization-code flow with PKCE that native apps use instead,
  keeping the resulting tokens in the device keychain. Because
  `backend/src/main.py` lists the app's redirect URI in
  `OAuth(skip_consent_for_redirect_uris=...)`, Reboot signs the user
  straight in, with no consent screen — the same treatment the web app
  gets. A client that registers some *other* redirect URI still gets
  one.
extra_setup: null
