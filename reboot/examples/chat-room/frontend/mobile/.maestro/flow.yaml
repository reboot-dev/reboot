# Maestro end-to-end flow for the chat-room mobile app.
#
# Drives the real app on a real Android runtime (Hermes), through Expo
# Go, against a running Reboot backend. The orchestration script loads
# the app fresh (`expo start --android`), so this flow does not
# `launchApp` (that would reopen Expo Go's home); it drives the
# foreground app. `appId` is Expo Go's package because the app runs
# inside it.
#
# What it proves: a reactive read renders the backend's seeded message,
# and optimistic `send`s round-trip through the backend and render —
# i.e. the Reboot client's native networking actually works. Assertions
# target the `message-text` element by id (not arbitrary on-screen
# text) so they are precise about what they match.
appId: host.exp.exponent
---
# Wait for the app to load and mount before driving it. The harness
# starts this flow when Metro reports "Android Bundled", i.e. once the
# bundle is built; the device then has to fetch it over the emulator's
# user-mode NAT, parse ~900 modules in Hermes, and mount them. That
# takes 0.7s on an idle emulator and minutes on one still finishing a
# cold boot alongside Play Services, so budget for the slow case.
- extendedWaitUntil:
    visible:
      id: "message-input"
    timeout: 180000

# Expo Go's first-run onboarding sheet would swallow taps meant for the
# app. The test script launches with `EXPO_NO_DEV_MENU=1`, which keeps
# it closed; waiting for it here, tolerating its absence, is a safety
# net for a launch that lost that parameter.
- extendedWaitUntil:
    visible: "Bottom Sheet"
    timeout: 30000
    optional: true

# Dismiss the sheet, when it did open, with a downward swipe, and
# confirm it is gone so a failed swipe fails here by name.
- runFlow:
    when:
      visible: "Bottom Sheet"
    commands:
      - swipe:
          start: "50%, 65%"
          end: "50%, 95%"
      - extendedWaitUntil:
          notVisible: "Bottom Sheet"
          timeout: 10000
- waitForAnimationToEnd

# Reactive read: the backend seeds a "Hello, World!" message.
- assertVisible:
    id: "message-text"
    text: "Hello, World!"

# Send 1: the input is pre-filled "Hello, Reboot!" on a fresh launch,
# so just tap Send. Tapping Send also clears the input.
- tapOn:
    id: "send-button"
    retryTapIfNoChange: true
- assertVisible:
    id: "message-text"
    text: "Hello, Reboot!"

# Send 2: type a Maestro-specific message into the (now empty) input
# and send it; it must round-trip through the backend and render.
- tapOn:
    id: "message-input"
- inputText: "MaestroE2EOK"
- tapOn:
    id: "send-button"
- assertVisible:
    id: "message-text"
    text: "MaestroE2EOK"
