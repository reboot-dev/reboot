syntax = "proto3";

package rbt.dashboard.v1;

import "google/protobuf/timestamp.proto";
import "rbt/v1alpha1/options.proto";
import "rbt/v1alpha1/api/api.proto";
import "rbt/v1alpha1/api/schema.proto";
import "rbt/v1alpha1/bdd/feature.proto";

////////////////////////////////////////////////////////////////////////

// What the dashboard has read from the developer's API files.
message Dashboard {
  option (rbt.v1alpha1.state) = {
  };

  // The API directory as the developer spelled it to `rbt dashboard`,
  // e.g. "api": what, before a file's path relative to it, is the
  // path they would open.
  string api_directory = 1;

  // Why the API files could not be read, if they could not be. A
  // half-written file is the normal cause while someone is typing.
  optional string error = 2;

  // Represents every candidate API file the watch read, keyed by
  // its path relative to the API directory, as of the last write. A
  // restarted dashboard starts from these rather than reading every
  // file again; one that changed since this was written is simply
  // read again, which its digest says.
  map<string, File> api_files = 3;

  // What each file declaring an `api` declares, keyed the way
  // `api_files` is, which is also the `filename` inside.
  map<string, rbt.v1alpha1.api.API> apis = 4;

  // The digest of what each file declaring an `api` declares, as
  // it is now, keyed by the module `rbt generate` writes for the
  // file, relative to the generated directory the way `generated`
  // is keyed: `shop/v1/shop_rbt.py` for `shop/v1/shop.py`. The
  // module records the digest it was generated from.
  map<string, string> api_digests = 5;

  // Every servicer found in the developer's application, sorted. A
  // state type with no entry here is one no servicer was found for.
  // A state type with two is two classes servicing it, which is for
  // whoever reads this to make of what they will.
  repeated Servicer servicers = 6;

  // Represents every file the walk of the application analyzed,
  // keyed by its path, relative to the working directory for a file
  // under it and absolute otherwise, as of the last write. A
  // restarted dashboard starts from these rather than parsing and
  // analyzing every file again; one that changed since this was
  // written is simply parsed again, which its digest says.
  map<string, File> code_files = 7;

  // Represents every `_rbt` module in the generated directory, the
  // one `rbt generate` writes per API file, keyed by its path
  // relative to the directory, e.g. "shop/v1/shop_rbt.py", as of
  // the last write. A listing rather than what the walk reached,
  // since a module nothing imports yet is still generated. Empty
  // when no generated directory was named.
  //
  // Against `api_files`, this says whether an API file's generated
  // code is missing or out of date, which is what suggests running
  // `rbt generate`.
  map<string, Generated> generated = 8;

  // What each of the developer's `.feature` files declares, keyed
  // by the file's path relative to the working directory, as of the
  // last write.
  map<string, rbt.v1alpha1.bdd.Feature> features = 9;
}

message DashboardGetRequest {}

message DashboardGetResponse {
  // Why `rbt generate` has to run: an API file's generated module
  // is `MISSING`, or the file `CHANGED` since the module was
  // generated from it, by the digest both record. A module
  // recording no digest was generated before digests were, so
  // whether it came from the file as it is is unknowable, which
  // also reads as `CHANGED`; regenerating resolves it.
  enum NeedsGenerateReason {
    UNKNOWN = 0;
    MISSING = 1;
    CHANGED = 2;
  }

  string api_directory = 1;
  optional string error = 2;
  map<string, File> api_files = 3;
  map<string, rbt.v1alpha1.api.API> apis = 4;
  map<string, string> api_digests = 5;
  repeated Servicer servicers = 6;
  map<string, Generated> generated = 7;

  // The worst reason over all the API files, and absent when
  // nothing says to run `rbt generate`.
  optional NeedsGenerateReason needs_generate_reason = 8;

  map<string, rbt.v1alpha1.bdd.Feature> features = 9;
}

message DashboardUpdateApiRequest {
  string api_directory = 1;
  optional string error = 2;
  map<string, File> api_files = 3;
  map<string, rbt.v1alpha1.api.API> apis = 5;
  map<string, string> api_digests = 6;

  // What differs from what the state records, for the changelog.
  // Recorded in the same transaction as the state, so that the
  // changelog never says something the state does not.
  repeated Change changes = 4;
}

message DashboardUpdateApiResponse {}

message DashboardUpdateCodeRequest {
  repeated Servicer servicers = 1;
  map<string, File> code_files = 2;
  map<string, Generated> generated = 3;

  // What differs from what the state records, for the changelog.
  // Recorded in the same transaction as the state, so that the
  // changelog never says something the state does not.
  repeated Change changes = 4;
}

message DashboardUpdateCodeResponse {}

// One thing the dashboard noticed change. Each arm is one whole
// event and says everything about itself; nothing is shared between
// arms but the uuidv7 key the changelog stores it under, which is
// when it happened. Stored as the serialized `Change`.
message Change {
  oneof change {
    StateTypeAdded state_type_added = 1;
    StateTypeChanged state_type_changed = 2;
    StateTypeRemoved state_type_removed = 3;

    DataTypeAdded data_type_added = 4;
    DataTypeChanged data_type_changed = 5;
    DataTypeRemoved data_type_removed = 6;

    CodeAdded code_added = 7;
    CodeChanged code_changed = 8;
    CodeRemoved code_removed = 9;
  }
}

// What one thing was and is, for a change that is a move from one
// value to another.
message Renamed {
  string from = 1;
  string to = 2;
}

message DescriptionChanged {
  optional string from = 1;
  optional string to = 2;
}

message TypeChanged {
  rbt.v1alpha1.api.Type from = 1;
  rbt.v1alpha1.api.Type to = 2;
}

message RequiredChanged {
  // Whether the property is required now.
  bool required = 1;
}

// A property's default, as JSON text; absent for no default.
message DefaultChanged {
  optional string from = 1;
  optional string to = 2;
}

// A property's constraints; absent for none.
message ConstraintsChanged {
  optional rbt.v1alpha1.api.Constraints from = 1;
  optional rbt.v1alpha1.api.Constraints to = 2;
}

message DeprecatedChanged {
  // Whether the property is deprecated now.
  bool deprecated = 1;
}

message PropertyAdded {}

message PropertyRemoved {}

// One property of a state model or data type, and one thing that
// happened to it. One entry per thing: a property whose type and
// requiredness both changed is two entries.
message PropertyChange {
  // What identifies the property: its tag, which is what it is
  // shipped under, so a rename keeps it and a retag does not.
  uint32 tag = 1;

  // Its name now; for a removed property, the name it had.
  string name = 2;

  oneof change {
    PropertyAdded added = 3;
    PropertyRemoved removed = 4;
    Renamed renamed = 5;
    TypeChanged type = 6;
    RequiredChanged required = 7;
    DefaultChanged default = 8;
    DescriptionChanged description = 9;
    ConstraintsChanged constraints = 10;
    DeprecatedChanged deprecated = 11;
  }
}

message MethodAdded {}

message MethodRemoved {}

// A method's kind: which arm of `rbt.v1alpha1.api.Method.kind`
// the method declares.
message KindChanged {
  enum Kind {
    UNKNOWN = 0;
    READER = 1;
    WRITER = 2;
    TRANSACTION = 3;
    WORKFLOW = 4;
  }

  Kind from = 1;
  Kind to = 2;
}

message FactoryChanged {
  bool factory = 1;
}

// How a method is exposed over MCP; absent for not at all.
message MCPChanged {
  optional rbt.v1alpha1.api.MCP from = 1;
  optional rbt.v1alpha1.api.MCP to = 2;
}

// The request or response type, by name; absent for none.
message RequestChanged {
  optional rbt.v1alpha1.api.Reference from = 1;
  optional rbt.v1alpha1.api.Reference to = 2;
}

message ResponseChanged {
  optional rbt.v1alpha1.api.Reference from = 1;
  optional rbt.v1alpha1.api.Reference to = 2;
}

message ErrorsChanged {
  repeated rbt.v1alpha1.api.Reference from = 1;
  repeated rbt.v1alpha1.api.Reference to = 2;
}

// One method of a state type, and one thing that happened to it.
// One entry per thing.
message MethodChange {
  string name = 1;

  oneof change {
    MethodAdded added = 2;
    MethodRemoved removed = 3;
    KindChanged kind = 4;
    FactoryChanged factory = 5;
    MCPChanged mcp = 6;
    RequestChanged request = 7;
    ResponseChanged response = 8;
    ErrorsChanged errors = 9;
    DescriptionChanged description = 10;
  }
}

// A method's body does something different: the digest of its
// syntax, with formatting and comments left out, moved.
message BodyChanged {}

// The Reboot calls a method's implementation makes, followed
// through the functions it calls, are not what they were, while the
// method's own body is: a function it calls into changed.
message CallsChanged {}

// A state type the API files declare.
message StateTypeAdded {
  // Fully qualified, e.g. "shop.v1.Shop".
  string name = 1;
  string filename = 2;
}

// The state model's class renamed, which is separate from the state
// type's own name.
message StateModelRenamed {
  string from = 1;
  string to = 2;
}

// Never without something that changed: every change to a state
// type is one of its methods, one of its properties, its
// description or its state model's name.
message StateTypeChanged {
  string name = 1;
  string filename = 2;
  repeated MethodChange methods = 3;
  repeated PropertyChange properties = 4;
  optional DescriptionChanged description = 5;
  optional StateModelRenamed state_model_renamed = 6;
}

message StateTypeRemoved {
  string name = 1;
  // The file it was declared in.
  string filename = 2;
}

// A data type the API files declare: a model that is not a state.
message DataTypeAdded {
  // Qualified by the module of the file declaring it, e.g.
  // "shop.v1.LookRequest".
  string name = 1;
  string filename = 2;

  // The package the data type belongs to. Recorded rather than
  // derived from `name`, whose spelling depends on what declared
  // the type: a Pydantic model's name carries its module, a proto
  // message's its package.
  string package = 3;
}

// Never without something that changed: every change to a data type
// is one of its properties or its description.
message DataTypeChanged {
  string name = 1;
  string filename = 2;
  repeated PropertyChange properties = 3;
  optional DescriptionChanged description = 4;

  // The package the data type belongs to. Recorded rather than
  // derived from `name`, whose spelling depends on what declared
  // the type: a Pydantic model's name carries its module, a proto
  // message's its package.
  string package = 5;
}

message DataTypeRemoved {
  string name = 1;
  string filename = 2;

  // The package the data type belongs to. Recorded rather than
  // derived from `name`, whose spelling depends on what declared
  // the type: a Pydantic model's name carries its module, a proto
  // message's its package.
  string package = 3;
}

// How the application implements a state type: a servicer.
message CodeAdded {
  string state_type = 1;
  string filename = 2;
}

// One method of a servicer doing something different.
message CodeChanged {
  string state_type = 1;
  string filename = 2;

  // The method, named as the developer wrote it.
  string method = 3;

  oneof change {
    BodyChanged body = 4;
    CallsChanged calls = 5;
  }
}

message CodeRemoved {
  string state_type = 1;
  string filename = 2;
}

message DashboardWatchApiRequest {}

message DashboardWatchApiResponse {}

message DashboardWatchCodeRequest {}

message DashboardWatchCodeResponse {}

message DashboardUpdateBehaviorsRequest {
  // Keyed the way `Dashboard.features` is.
  map<string, rbt.v1alpha1.bdd.Feature> features = 1;
}

message DashboardUpdateBehaviorsResponse {}

message DashboardWatchBehaviorsRequest {}

message DashboardWatchBehaviorsResponse {}

////////////////////////////////////////////////////////////////////////

// One servicer found in the developer's application, and the state
// type it services.
message Servicer {
  // Represents one method a servicer defines, and what analyzing it
  // found.
  message Method {
    // Represents the name of the method as the developer wrote it,
    // e.g. "deposit". A method the API files declare is spelled the
    // same way there.
    string name = 1;

    // Represents a hash digest of the method's syntax with the lines
    // and columns left out, so that a comment added above the method
    // or arguments rewrapped across lines do not change it. It says
    // whether the method does anything different, not whether it was
    // written down differently.
    bytes digest = 2;

    // Represents one Reboot call the method's implementation makes.
    message Call {
      // Represents how the call is reached.
      enum How {
        UNKNOWN = 0;
        // A plain method call on a reference.
        CALL = 1;
        // A constructor, called on the state type itself, which
        // both makes the state and returns a reference to it.
        CONSTRUCT = 2;
        // Reached through `.schedule(when=...)`.
        SCHEDULE = 3;
        // Reached through `.spawn(when=...)`.
        SPAWN = 4;
        // Reached through `.forall(ids)`, calling every one of the
        // state type's states.
        FORALL = 5;
        // Reached through `.until(alias)`, awaited until what the
        // method reads satisfies a condition.
        UNTIL = 6;
      }

      // Represents the state type called, spelled as the runtime
      // names one: its package, then its name, e.g. `shop.v1.Shop`.
      string state_type = 1;

      // Represents the method called, spelled as `Method.name`.
      string method = 2;

      How how = 3;
    }

    // Represents every Reboot call the method's implementation
    // makes.
    repeated Call calls = 3;

    // Represents every call the analysis could not resolve to a
    // Reboot definition: possibly a helper that itself makes
    // Reboot calls, to be followed by a future analysis, and
    // possibly nothing of Reboot's. Spelled the way `ast.unparse`
    // writes the callee, e.g. "self._transfer".
    repeated string ambiguous = 4;
  }

  // The state type it services, spelled as the runtime names one,
  // e.g. `shop.v1.Shop`.
  string state_type = 1;

  // The file it is written in, spelled the way the developer would
  // open it, e.g. "backend/src/account_servicer.py".
  string filename = 2;

  // Represents the line its class is written on, counting from one.
  uint32 line = 4;

  // Represents the column its class starts at, counting from zero.
  uint32 character = 5;

  // Represents every method it defines, in the order they are
  // written, which is the order somebody reading the file meets them.
  repeated Method methods = 3;
}

// What analyzing one of the developer's files used: the digest
// of its bytes and what each of its imports observed. What a
// restarted dashboard reconstitutes its knowledge from, so that only
// files that changed while it was down are parsed and analyzed
// again.
message File {
  // Represents a file depended on: which file, with which bytes.
  message Dependency {
    // Represents the file, e.g. "backend/api/shop/v1/shop_rbt.py".
    // Relative to the working directory for a file under it,
    // absolute for any other file, so that the spelling stays true
    // when the project directory is moved. For a dependency an
    // import observed, absent when there was no file at the
    // import's possible module path: it names code outside the
    // roots, or code that does not exist yet.
    optional string filename = 1;

    // Represents a digest of the bytes `filename` was read with.
    // Absent when there were no usable bytes: `filename` is absent,
    // or the file could not be read.
    optional bytes digest = 2;
  }

  // Represents a digest of the file's own bytes, saying whether the
  // file changed since it was analyzed.
  bytes digest = 1;

  // Represents what each import observed, keyed by possible module
  // path: e.g. "shop/v1/shop_rbt" for
  // `import shop.v1.shop_rbt`, "./backend/db" for a relative import
  // written in `backend`, and "shop/v1/shop_rbt/Shop" for the
  // chance that an imported name is a module of its own.
  map<string, Dependency> dependencies = 2;

  // Represents the files outside every root -- the application's
  // directory and the generated directory -- that this file's
  // analysis read, e.g. an installed package's `_rbt` module. The
  // walk never finds these, so each is digested directly at the
  // end of a walk, and a change reanalyzes this file.
  repeated Dependency external = 3;

  // Represents why the file could not be read, when it could not
  // be: a file that will not parse, or will not import. Absent for
  // a file that read.
  optional string error = 4;

  // Represents when the file was last modified, as the filesystem
  // records it, as of the last write. Against the generated files'
  // times, what says whether generated code is older than the API
  // files. Recorded for the API's files; the implementation's are
  // not compared by time.
  google.protobuf.Timestamp modified = 5;
}

// Represents one file in the generated directory, as of the last
// write.
message Generated {
  // Represents when the file was last modified, as the filesystem
  // records it.
  google.protobuf.Timestamp modified = 1;

  // Represents the digest of what the API file declared when the
  // module was generated from it, as the module records it. Absent
  // for a module recording none: one generated before digests were
  // recorded, or from a `.proto`.
  optional string api_digest = 2;
}

////////////////////////////////////////////////////////////////////////

// The developer's machine-local dashboard preferences.
message Preferences {
  option (rbt.v1alpha1.state) = {
  };

  // Whether the developer has asked `rbt dev run` to stop opening a
  // dashboard by itself. False, the default, means `rbt dev run`
  // opens a dashboard when none is already open.
  //
  // `--open-dashboard` opens one even when this is true.
  bool suppress_open_on_restart = 1;

  // The methods whose detail the developer has opened, spelled as
  // the state type's fully qualified name, a dot, then the method:
  // e.g. `bank.v1.Account.deposit`. `SetMethodsExpanded` keeps this
  // sorted, so that the same set of methods is stored the same way
  // whatever order they were opened in. A state type's own toggle
  // is the same set: every one of its methods, opened or closed
  // together.
  repeated string expanded_methods = 2;

  // How wide the developer has dragged the sidebar, in CSS pixels.
  // Unset until the developer drags it; until then the page picks
  // the width, and may change what it picks.
  optional uint32 nav_width = 3;
}

message PreferencesGetRequest {}

message PreferencesGetResponse {
  bool suppress_open_on_restart = 1;
  repeated string expanded_methods = 2;
  optional uint32 nav_width = 3;
}

message PreferencesSetSuppressOpenOnRestartRequest {
  bool suppress_open_on_restart = 1;
}

message PreferencesSetSuppressOpenOnRestartResponse {}

message PreferencesSetMethodsExpandedRequest {
  // The fully qualified name of one state type, spelled as the
  // runtime names one: e.g. `shop.v1.Shop`.
  string state_type = 1;

  // The methods to open or close, named as the developer wrote
  // them: one for a single method's toggle, all of the state
  // type's for its own.
  repeated string methods = 2;

  bool expanded = 3;
}

message PreferencesSetMethodsExpandedResponse {}

message PreferencesSetNavWidthRequest {
  uint32 nav_width = 1;
}

message PreferencesSetNavWidthResponse {}

////////////////////////////////////////////////////////////////////////

service DashboardMethods {
  rpc Get(DashboardGetRequest) returns (DashboardGetResponse) {
    option (rbt.v1alpha1.method).reader = {
    };
  }

  // Replaces what the API files declare and records what changed,
  // as one transaction. Assigns each change its key, so that a
  // workflow retrying this call sends an identical request every
  // attempt.
  rpc UpdateApi(DashboardUpdateApiRequest)
      returns (DashboardUpdateApiResponse) {
    option (rbt.v1alpha1.method).transaction = {
    };
  }

  // Replaces what the application implements and records what
  // changed, the same way.
  rpc UpdateCode(DashboardUpdateCodeRequest)
      returns (DashboardUpdateCodeResponse) {
    option (rbt.v1alpha1.method).transaction = {
    };
  }

  // Watches the developer's API files for as long as the dashboard
  // application runs, reading each one that changes.
  rpc WatchApi(DashboardWatchApiRequest) returns (DashboardWatchApiResponse) {
    option (rbt.v1alpha1.method).workflow = {
    };
  }

  // Watches the developer's application for as long as the
  // dashboard application runs, working out which of their files
  // implements each state type whenever one of those files changes.
  rpc WatchCode(DashboardWatchCodeRequest)
      returns (DashboardWatchCodeResponse) {
    option (rbt.v1alpha1.method).workflow = {
    };
  }

  // Replaces what the developer's `.feature` files declare. Its own
  // writer, so that recording behaviors never writes back what the
  // other two updates record.
  rpc UpdateBehaviors(DashboardUpdateBehaviorsRequest)
      returns (DashboardUpdateBehaviorsResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }

  // Watches the developer's `.feature` files for as long as the
  // dashboard application runs, parsing each one that changes.
  rpc WatchBehaviors(DashboardWatchBehaviorsRequest)
      returns (DashboardWatchBehaviorsResponse) {
    option (rbt.v1alpha1.method).workflow = {
    };
  }
}

////////////////////////////////////////////////////////////////////////

service PreferencesMethods {
  rpc Get(PreferencesGetRequest) returns (PreferencesGetResponse) {
    option (rbt.v1alpha1.method).reader = {
    };
  }

  rpc SetSuppressOpenOnRestart(PreferencesSetSuppressOpenOnRestartRequest)
      returns (PreferencesSetSuppressOpenOnRestartResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }

  // Takes one state type so that two tabs toggling different state
  // types at the same moment do not overwrite each other's change.
  rpc SetMethodsExpanded(PreferencesSetMethodsExpandedRequest)
      returns (PreferencesSetMethodsExpandedResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }

  // Its own writer, like the two above, so that recording a drag
  // never writes back the rest of this state.
  rpc SetNavWidth(PreferencesSetNavWidthRequest)
      returns (PreferencesSetNavWidthResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }
}
