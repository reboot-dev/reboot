syntax = "proto3";

package rbt.dashboard.v1;

import "rbt/v1alpha1/options.proto";

////////////////////////////////////////////////////////////////////////

// The information the developer dashboard needs to display data
// about the Reboot application being developed.

message FieldInfo {
  string name = 1;
  string type = 2;
}

message MethodInfo {
  string name = 1;
  string kind = 2;
  repeated FieldInfo arguments = 3;
  repeated FieldInfo returns = 4;
  repeated string errors = 5;
  optional string description = 6;
  bool factory = 7;
  bool mcp = 8;
}

message StateTypeInfo {
  string name = 1;

  // The file the developer declared it in, e.g.
  // "bank/v1/account.py".
  string file = 2;
  repeated FieldInfo fields = 3;
  repeated MethodInfo methods = 4;

  // What the state type does, in the author's own words.
  optional string description = 5;
}

////////////////////////////////////////////////////////////////////////

// What the dashboard application has read of the developer's API
// files, so that a browser can read it without reaching the
// application itself.
message API {
  option (rbt.v1alpha1.state) = {
  };

  // The state types the developer's API files declare, which exist
  // before the application does.
  repeated StateTypeInfo state_types = 1;

  // Why the API files could not be read, if they could not be. A
  // half-written file is the normal case while someone is typing, and
  // saying so beats showing nothing.
  string error = 2;
}

message APIGetRequest {}

message APIGetResponse {
  repeated StateTypeInfo state_types = 1;
  string error = 2;
}

message APIUpdateRequest {
  repeated StateTypeInfo state_types = 1;
  string error = 2;
}

message APIUpdateResponse {}

message APIWatchRequest {}

message APIWatchResponse {}

////////////////////////////////////////////////////////////////////////

// One servicer found in the developer's application, and the state
// type it services.
message ServicerInfo {
  // Represents one method a servicer defines, and what analyzing it
  // found.
  message Method {
    // Represents the name of the method as the developer wrote it,
    // e.g. "deposit". A method the API files declare is spelled the
    // same way there.
    string name = 1;

    // Represents a hash digest of the method's syntax with the lines
    // and columns left out, so that a comment added above the method
    // or arguments rewrapped across lines do not change it. It says
    // whether the method does anything different, not whether it was
    // written down differently.
    bytes digest = 2;
  }

  // The state type it services, spelled as `StateTypeInfo.name`.
  string state_type = 1;

  // The file it is written in, spelled the way the developer would
  // open it, e.g. "backend/src/account_servicer.py".
  string file = 2;

  // Represents the line its class is written on, counting from one.
  uint32 line = 4;

  // Represents the column its class starts at, counting from zero.
  uint32 character = 5;

  // Represents every method it defines, in the order they are
  // written, which is the order somebody reading the file meets them.
  repeated Method methods = 3;
}

// What analyzing one of the developer's files leaned on: the digest
// of its bytes and what each of its imports observed. What a
// restarted dashboard reconstitutes its knowledge from, so that only
// files that changed while it was down are parsed and analyzed
// again.
message FileInfo {
  // Represents what one import observed when the file was analyzed.
  message Dependency {
    // Represents the file the module resolved to, by its resolved
    // path. Absent when the module resolved to no file: outside the
    // roots, generated, or not existing at all.
    optional string filename = 1;

    // Represents a digest of the bytes `filename` was read with.
    // Absent when there were no usable bytes: `filename` is absent,
    // or the file could not be read.
    optional bytes digest = 2;
  }

  // Represents a digest of the file's own bytes, saying whether the
  // file changed since it was analyzed.
  bytes digest = 1;

  // Represents what each import observed, keyed by the module as
  // the import spells it.
  map<string, Dependency> dependencies = 2;
}

// What the dashboard application has read of the developer's
// application: which of their files implements each state type.
//
// Held apart from `API` because the two are read from different
// places, at different moments, and neither says anything about the
// other. An API file says a state type exists; only the application
// says where it is implemented. Whoever wants both asks for both.
message Implementation {
  option (rbt.v1alpha1.state) = {
  };

  // Every servicer found, sorted. A state type with no entry here is
  // one no servicer was found for -- which, before this has ever been
  // written, is all of them. A state type with two is two classes
  // servicing it, which is for whoever reads this to make of what
  // they will.
  repeated ServicerInfo servicers = 1;

  // Whether `rbt generate` has written the application's generated
  // code, which is where the state types the servicers service are
  // defined. A servicer only joins the list above once its state
  // type is defined there, so while this is false the dashboard
  // suggests running `rbt generate`.
  bool generated = 2;

  // Represents every file the walk analyzed, keyed by its resolved
  // path, as of the last write. A restarted dashboard starts from
  // these rather than parsing and analyzing every file again; one
  // that changed since this was written is simply parsed again,
  // which its digest says.
  map<string, FileInfo> files = 3;
}

message ImplementationGetRequest {}

message ImplementationGetResponse {
  repeated ServicerInfo servicers = 1;
  bool generated = 2;
}

message ImplementationWatchRequest {}

message ImplementationWatchResponse {}

////////////////////////////////////////////////////////////////////////

// What the developer has told the dashboard about opening dashboards.
//
// Kept here rather than in a file under their project because it is a
// fact about their machine and their browser, not about their
// application, and nothing about it belongs in their repository. It
// survives a hot reload and an `rbt dev run` restart because the
// dashboard application's state store does.
message Preferences {
  option (rbt.v1alpha1.state) = {
  };

  // Whether the developer has asked `rbt dev run` to stop opening a
  // dashboard by itself. Recorded as the exception rather than as
  // the rule, so that somebody who has never chosen gets a dashboard
  // opened when nobody is looking at one.
  //
  // `--open-dashboard` opens one whatever this says.
  bool suppress_open_on_restart = 1;

  // The state types whose methods the developer has opened on the
  // dashboard, by fully qualified name such as `bank.v1.Account`.
  // Held as the set that is open rather than the set that is closed,
  // so that somebody who has clicked nothing gets a page where every
  // state type shows its methods but none of their detail.
  //
  // Kept sorted, so that clicking two state types open in one order
  // and then the other stores the same thing both times.
  repeated string expanded_state_types = 2;
}

message PreferencesGetRequest {}

message PreferencesGetResponse {
  bool suppress_open_on_restart = 1;
  repeated string expanded_state_types = 2;
}

message PreferencesSetSuppressOpenOnRestartRequest {
  bool suppress_open_on_restart = 1;
}

message PreferencesSetSuppressOpenOnRestartResponse {}

message PreferencesSetExpandedRequest {
  // The fully qualified name of one state type, spelled the way
  // `StateTypeInfo` spells it.
  string state_type = 1;

  bool expanded = 2;
}

message PreferencesSetExpandedResponse {}

////////////////////////////////////////////////////////////////////////

service APIMethods {
  rpc Get(APIGetRequest) returns (APIGetResponse) {
    option (rbt.v1alpha1.method).reader = {
    };
  }

  rpc Update(APIUpdateRequest) returns (APIUpdateResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }

  // Watches the developer's API files for as long as the dashboard
  // application runs, reading each one that changes.
  rpc Watch(APIWatchRequest) returns (APIWatchResponse) {
    option (rbt.v1alpha1.method).workflow = {
    };
  }
}

////////////////////////////////////////////////////////////////////////

service ImplementationMethods {
  rpc Get(ImplementationGetRequest) returns (ImplementationGetResponse) {
    option (rbt.v1alpha1.method).reader = {
    };
  }

  // Watches the developer's application for as long as the dashboard
  // application runs, working out which of their files implements
  // each state type whenever one of those files changes.
  rpc Watch(ImplementationWatchRequest) returns (ImplementationWatchResponse) {
    option (rbt.v1alpha1.method).workflow = {
    };
  }
}

////////////////////////////////////////////////////////////////////////

service PreferencesMethods {
  rpc Get(PreferencesGetRequest) returns (PreferencesGetResponse) {
    option (rbt.v1alpha1.method).reader = {
    };
  }

  rpc SetSuppressOpenOnRestart(PreferencesSetSuppressOpenOnRestartRequest)
      returns (PreferencesSetSuppressOpenOnRestartResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }

  // One state type per call rather than the whole set, so that two
  // tabs opening two different state types at the same moment do not
  // each write back a set that predates the other's click.
  rpc SetExpanded(PreferencesSetExpandedRequest)
      returns (PreferencesSetExpandedResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }
}
