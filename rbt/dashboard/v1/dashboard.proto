syntax = "proto3";

package rbt.dashboard.v1;

import "rbt/v1alpha1/options.proto";

////////////////////////////////////////////////////////////////////////

// What the dashboard has read from the developer's API files.
message API {
  option (rbt.v1alpha1.state) = {
  };

  repeated StateType state_types = 1;

  // Why the API files could not be read, if they could not be. A
  // half-written file is the normal cause while someone is typing.
  optional string error = 2;
}

message StateType {
  // Fully qualified by the file's directory: `shop/v1/shop.py`
  // declaring `Shop` yields `shop.v1.Shop`.
  string name = 1;

  // The path including the directory passed to `--api-directory`.
  string file = 2;

  optional string description = 3;

  repeated Method methods = 4;

  // JSON Schema of the state model, as JSON text so that `properties`
  // stays in the order the developer declared the fields.
  string state_schema = 5;

  // The request, response and error models of the methods, and
  // anything those contain, however deeply nested. Every name a
  // `Method` or a `$ref` in this state type uses is the `name` of
  // exactly one entry in this list. Another state type's list may
  // contain a different model under the same name.
  repeated DataType data_types = 6;
}

message Method {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    READER = 1;
    WRITER = 2;
    TRANSACTION = 3;
    WORKFLOW = 4;
  }

  string name = 1;

  Kind kind = 2;

  bool factory = 3;

  // Whether the application exposes the method as an MCP tool.
  bool mcp = 4;

  // Names of entries in the enclosing state type's `data_types`.
  // Absent when the method takes or returns nothing.
  optional string request = 5;
  optional string response = 6;
  repeated string errors = 7;

  optional string description = 8;
}

// A model that is not a state model: a request, a response, an
// error, or anything those contain, however deeply nested.
message DataType {
  string name = 1;

  // Pydantic's JSON Schema for the model, as JSON text. A reference
  // to a sibling is spelled `#/$defs/<name>`, `<name>` being that
  // sibling's `name`.
  string schema = 2;
}

message APIGetRequest {}

message APIGetResponse {
  repeated StateType state_types = 1;
  optional string error = 2;
}

message APIUpdateRequest {
  repeated StateType state_types = 1;
  optional string error = 2;
}

message APIUpdateResponse {}

// One type that was added, changed or removed, as `changelog.py`
// records it.
//
// `kind`, `change` and `part` keep their lowercase spellings: entries
// recorded before these messages existed persist in the changelog
// with those words, and the page uses the values directly as CSS
// class names and routes.
message Change {
  // The type's page id, such as `shop.v1.Shop`.
  string id = 1;

  // `state` or `data`: which page shows the type.
  string kind = 2;

  string name = 3;
  string namespace = 4;
  string file = 5;

  // `added`, `changed` or `removed`.
  string change = 6;

  // Set only when `change` is `changed`: which of the type's parts
  // were added, changed or removed.
  repeated ChangedPart changed_parts = 7;
}

// One part of a changed type, and what happened to it.
message ChangedPart {
  string name = 1;

  // `added`, `changed` or `removed`.
  string change = 2;

  // `method`, `property` or `state`.
  string part = 3;
}

message APIRecordChangesRequest {
  repeated Change changes = 1;
}

message APIRecordChangesResponse {}

message APIWatchRequest {}

message APIWatchResponse {}

////////////////////////////////////////////////////////////////////////

// One servicer found in the developer's application, and the state
// type it services.
message ServicerInfo {
  // The state type it services, spelled as `StateTypeInfo.name`.
  string state_type = 1;

  // The file it is written in, spelled the way the developer would
  // open it, e.g. "backend/src/account_servicer.py".
  string file = 2;
}

// What the dashboard application has read of the developer's
// application: which of their files implements each state type.
//
// Held apart from `API` because the two are read from different
// places, at different moments, and neither says anything about the
// other. An API file says a state type exists; only the application
// says where it is implemented. Whoever wants both asks for both.
message Implementation {
  option (rbt.v1alpha1.state) = {
  };

  // Every servicer found, sorted. A state type with no entry here is
  // one no servicer was found for -- which, before this has ever been
  // written, is all of them. A state type with two is two classes
  // servicing it, which is for whoever reads this to make of what
  // they will.
  repeated ServicerInfo servicers = 1;
}

message ImplementationGetRequest {}

message ImplementationGetResponse {
  repeated ServicerInfo servicers = 1;
}

message ImplementationWatchRequest {}

message ImplementationWatchResponse {}

////////////////////////////////////////////////////////////////////////

// The developer's machine-local dashboard preferences.
message Preferences {
  option (rbt.v1alpha1.state) = {
  };

  // Whether the developer has asked `rbt dev run` to stop opening a
  // dashboard by itself. False, the default, means `rbt dev run`
  // opens a dashboard when none is already open.
  //
  // `--open-dashboard` opens one even when this is true.
  bool suppress_open_on_restart = 1;

  // The state types whose methods the developer has expanded on the
  // dashboard, by fully qualified name such as `bank.v1.Account`.
  // A collapsed state type shows its methods; an expanded one also
  // shows their detail. SetExpanded keeps this sorted, so that the
  // same set of state types is stored the same way whatever order
  // they were expanded in.
  repeated string expanded_state_types = 2;

  // How wide the developer has dragged the sidebar, in CSS pixels.
  // Unset until the developer drags it; until then the page picks
  // the width, and may change what it picks.
  optional uint32 nav_width = 3;
}

message PreferencesGetRequest {}

message PreferencesGetResponse {
  bool suppress_open_on_restart = 1;
  repeated string expanded_state_types = 2;
  optional uint32 nav_width = 3;
}

message PreferencesSetSuppressOpenOnRestartRequest {
  bool suppress_open_on_restart = 1;
}

message PreferencesSetSuppressOpenOnRestartResponse {}

message PreferencesSetExpandedRequest {
  // The fully qualified name of one state type, spelled the way
  // `StateType.name` spells it: e.g., `shop.v1.Shop`.
  string state_type = 1;

  bool expanded = 2;
}

message PreferencesSetExpandedResponse {}

message PreferencesSetNavWidthRequest {
  uint32 nav_width = 1;
}

message PreferencesSetNavWidthResponse {}

////////////////////////////////////////////////////////////////////////

service APIMethods {
  rpc Get(APIGetRequest) returns (APIGetResponse) {
    option (rbt.v1alpha1.method).reader = {
    };
  }

  rpc Update(APIUpdateRequest) returns (APIUpdateResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }

  // RecordChanges assigns each change its key, so that a workflow
  // retrying this call sends an identical request every attempt.
  rpc RecordChanges(APIRecordChangesRequest)
      returns (APIRecordChangesResponse) {
    option (rbt.v1alpha1.method).transaction = {
    };
  }

  // Watches the developer's API files for as long as the dashboard
  // application runs, reading each one that changes.
  rpc Watch(APIWatchRequest) returns (APIWatchResponse) {
    option (rbt.v1alpha1.method).workflow = {
    };
  }
}

////////////////////////////////////////////////////////////////////////

service ImplementationMethods {
  rpc Get(ImplementationGetRequest) returns (ImplementationGetResponse) {
    option (rbt.v1alpha1.method).reader = {
    };
  }

  // Watches the developer's application for as long as the dashboard
  // application runs, working out which of their files implements
  // each state type whenever one of those files changes.
  rpc Watch(ImplementationWatchRequest) returns (ImplementationWatchResponse) {
    option (rbt.v1alpha1.method).workflow = {
    };
  }
}

////////////////////////////////////////////////////////////////////////

service PreferencesMethods {
  rpc Get(PreferencesGetRequest) returns (PreferencesGetResponse) {
    option (rbt.v1alpha1.method).reader = {
    };
  }

  rpc SetSuppressOpenOnRestart(PreferencesSetSuppressOpenOnRestartRequest)
      returns (PreferencesSetSuppressOpenOnRestartResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }

  // Takes one state type so that two tabs toggling different state
  // types at the same moment do not overwrite each other's change.
  rpc SetExpanded(PreferencesSetExpandedRequest)
      returns (PreferencesSetExpandedResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }

  // Its own writer, like the two above, so that recording a drag
  // never writes back the rest of this state.
  rpc SetNavWidth(PreferencesSetNavWidthRequest)
      returns (PreferencesSetNavWidthResponse) {
    option (rbt.v1alpha1.method).writer = {
    };
  }
}
