message TransactionParticipantFailedToCommit {}

////////////////////////////////////////////////////////////////////////

// Raised by a transaction participant when the current transaction
// must be started over from its root. Retried like `Unavailable`; the
// fields say why, and how the retry should behave.
message TransactionShouldRetry {
  enum Reason {
    UNKNOWN = 0;
    // The participant's server recovered after the transaction
    // began, so it may already have taken part and lost that state,
    // and refuses to join.
    RESTART_DETECTED = 1;
    // The transaction waited longer than the grace period on a state
    // owned by an older transaction and is presumed deadlocked with
    // it. It aborts so that the older one proceeds, which is what
    // keeps two transactions waiting on each other from deadlocking.
    PRESUMED_DEADLOCK = 2;
  }

  Reason reason = 1;

  // The age of the aborted transaction: the root transaction id of
  // its first attempt, as a string. A retry sends it back as the
  // transaction's age so that the retried transaction is as old as
  // its first attempt rather than younger than every transaction
  // started since.
  string retry_age = 2;
}

