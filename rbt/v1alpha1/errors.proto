syntax = "proto3";

package rbt.v1alpha1;

////////////////////////////////////////////////////////////////////////
// Reboot:
////////////////////////////////////////////////////////////////////////

message StateAlreadyConstructed {}

////////////////////////////////////////////////////////////////////////

message StateNotConstructed {
  bool requires_constructor = 1;
}

////////////////////////////////////////////////////////////////////////

message UnknownService {}

////////////////////////////////////////////////////////////////////////

message InvalidMethod {}

////////////////////////////////////////////////////////////////////////

message UnknownTask {}

////////////////////////////////////////////////////////////////////////

message TransactionParticipantFailedToPrepare {}

////////////////////////////////////////////////////////////////////////

message TransactionParticipantFailedToCommit {}

////////////////////////////////////////////////////////////////////////

// Raised by a transaction participant when the current transaction
// must be started over from its root. Retried like `Unavailable`;
// `reason` says why.
message TransactionShouldRetry {
  enum Reason {
    UNKNOWN = 0;
    // The participant's server recovered after the transaction
    // began, so it may already have taken part and lost that state,
    // and refuses to join.
    RESTART_DETECTED = 1;
  }

  Reason reason = 1;
}

