syntax = "proto3";

package rbt.v1alpha1;

import "google/api/annotations.proto";

////////////////////////////////////////////////////////////////////////

message QueryRequest {
  // Unqualified name of a Reboot unary reader method, e.g. `MyReaderMethod`,
  // NOT `my.package.Service.MyReaderMethod`. Only unary reader methods are
  // supported.
  string method = 1;

  // Serialized request to be passed to the above method. The same
  // request is used each time we invoke the method.
  bytes request = 2;

  // Authorization bearer token.
  optional string bearer_token = 3;

  // ID of the `QueryResponse` this client has consumed, after which
  // it wants the query to continue. This is how a client whose
  // responses arrive over a websocket continues its query, on that
  // same websocket, and it is the only way that works for such a
  // client; see `Query`. Only meaningful on transports where a client
  // can send more than one message per query, i.e. websockets. When
  // this is set the other fields are ignored.
  string continue_query_response_id = 4;

  // Whether this client asks for each next response once it has
  // consumed the one before it. A client that does not set this gets
  // responses at whatever rate the server produces them, whether or
  // not it can consume them that fast.
  bool client_continues_query = 5;
}

message QueryResponse {
  oneof response_or_status {
    // Serialized response from the method specified in the request.
    bytes response = 1;

    // JSON representation of `google.rpc.Status`.
    //
    // TODO(benh): this is sent as JSON because `protoc-gen-es`
    // doesn't have `google.rpc.Status` and so we have our own
    // implementation which only has JSON support for now.
    string status = 3;
  }

  // Set of idempotency keys that caused mutations since the last time
  // that a response was returned.
  //
  // Only expected if `response` is present above.
  //
  // TODO(benh): send these as bytes?
  repeated string idempotency_keys = 2;

  // Unique ID of this response, which a client names to continue the
  // query after it. Only set when the client set
  // `client_continues_query` on its `QueryRequest`; an empty ID means
  // the client is not expected to ask for anything further.
  string query_response_id = 4;
}

////////////////////////////////////////////////////////////////////////

message ContinueQueryRequest {
  // ID of the `QueryResponse` the client has consumed; the query
  // continues after it.
  string query_response_id = 1;
}

message ContinueQueryResponse {}

////////////////////////////////////////////////////////////////////////

// TODO(benh): support batch, e.g., create a `MutateRequests` which
// takes a repeated `MutateRequest`.

message MutateRequest {
  // Unqualified name of a Reboot mutator (writer or transaction) method, e.g.
  // `MyMutatorMethod`, NOT `my.package.Service.MyMutatorMethod`.
  string method = 1;

  // JSON request to be passed to the above method. The same
  // request is used each time we invoke the method.
  bytes request = 2;

  // Idempotency key for this mutation.
  //
  // TODO(benh): send this as bytes?
  string idempotency_key = 3;

  // Authorization bearer token.
  optional string bearer_token = 4;
}

message MutateResponse {
  oneof response_or_status {
    // Serialized response from the method specified in the request.
    bytes response = 1;

    // JSON representation of `google.rpc.Status`.
    //
    // TODO(benh): this is sent as JSON because `protoc-gen-es`
    // doesn't have `google.rpc.Status` and so we have our own
    // implementation which only has JSON support for now.
    string status = 2;
  }
}

////////////////////////////////////////////////////////////////////////

message WebSocketsConnectionRequest {}

message WebSocketsConnectionResponse {}

////////////////////////////////////////////////////////////////////////

service React {
  // Allows users to "watch" the response of a unary reader method for
  // changes. The current response of the method is sent when the
  // stream is opened. A client that sets `client_continues_query`
  // asks for each next response once it has consumed the one before
  // it, and that next response reflects the _latest_ state, skipping
  // any states that came and went while the client was busy. A client
  // that does not set it gets responses at whatever rate the server
  // produces them, whether or not it can consume them that fast.
  //
  // How a client asks for the next response is determined by the
  // transport its responses arrive on, and only that way works: a
  // client reading over a websocket sends a `QueryRequest` with
  // `continue_query_response_id` set on that same websocket, and a
  // client reading over any other transport calls `ContinueQuery`.
  // The server tracks what it is waiting for per transport, so a
  // request that arrives the other way names an ID the server has no
  // record of, which it treats as one it has already handled: the
  // request is accepted and then ignored, and the query stops
  // producing responses.
  //
  // NOTE: the service name and state ID is expected to be part of the
  // gRPC metadata, exactly like any other reboot requests.
  rpc Query(QueryRequest) returns (stream QueryResponse) {
    option (google.api.http) = {
      post: "/rbt.v1alpha1.React/Query"
    };
  }

  // Tells the server that a client has consumed a response from
  // `Query` and wants the query to continue. Must be called on the
  // same server that produced the response.
  //
  // For a client whose responses arrive over a websocket this is the
  // wrong mechanism; such a client continues its query on the
  // websocket that carries its responses, by sending a `QueryRequest`
  // with `continue_query_response_id` set.
  rpc ContinueQuery(ContinueQueryRequest) returns (ContinueQueryResponse) {
    option (google.api.http) = {
      post: "/rbt.v1alpha1.React/ContinueQuery"
    };
  }

  // All connections must be HTTP/2 (h2), but the WebSocket protocol
  // is inherently HTTP/1.1. RFC 8441
  // (https://datatracker.ietf.org/doc/html/rfc8441) introduced
  // support for running the WebSocket Protocol over a single stream
  // of an HTTP/2 connection and all of the top browsers implement it.
  //
  // The caveat is that we need the HTTP/2 connection to exist in
  // order for websockets to use the existing HTTP/2 connection, hence
  // this method!
  //
  // For example usage, see corresponding code in the generated
  // TypeScript for React.
  rpc WebSocketsConnection(WebSocketsConnectionRequest)
      returns (WebSocketsConnectionResponse) {
    option (google.api.http) = {
      post: "/rbt.v1alpha1.React/WebSocketsConnection"
    };
  }
}

////////////////////////////////////////////////////////////////////////
