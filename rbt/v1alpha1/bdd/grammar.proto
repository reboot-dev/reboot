syntax = "proto3";

package rbt.v1alpha1.bdd;

////////////////////////////////////////////////////////////////////////

// A value as a step writes it: JSON (JSON5, so keys need no quotes),
// parsed against the property it is set on or asserted against when
// the scenario runs, since what `1` means depends on that property's
// type. May hold a variable, `<name>`, whose value is spliced in
// first: a column of a Scenario Outline's Examples table, or a value
// a step before it saved; a value that is only a variable is the
// saved value itself.
message Value {
  string json = 1;
}

// The state a step acts on: 'the `Account` for "alice"'.
message State {
  // The state type as the step spells it, e.g. `Account`, which a
  // step may qualify with its package.
  string type = 1;

  // The id as written, without its quotes; may be a variable,
  // `<name>`, whose value is the id.
  string id = 2;
}

// A `path=value` clause of a call's `with`: the property set and
// what it is set to.
message Assignment {
  string path = 1;

  Value value = 2;
}

// A `path=value` clause of an asserting list: the property equals
// the value.
message Equals {
  string path = 1;

  Value value = 2;
}

// A `path` containing `argument` clause: a substring of a string, an
// element of a list, or a key of a map.
message Containing {
  string path = 1;

  Value argument = 2;
}

// A `path` of length `length` clause: the length of a string, list,
// or map.
message OfLength {
  string path = 1;

  Value length = 2;
}

// One clause of an asserting list.
message Assertion {
  oneof assertion {
    Equals equals = 1;
    Containing containing = 2;
    OfLength of_length = 3;
  }
}

// A `path` saved as "name" clause: the property read and the name it
// is saved under.
message Save {
  string path = 1;

  string name = 2;
}

////////////////////////////////////////////////////////////////////////

// 'the application is up', or 'the "name" application is up' for one
// of several.
message ApplicationIsUp {
  optional string name = 1;
}

// '"alice" is an authenticated user': declares a user the scenario's
// steps may call as, minting a token for the user id.
message IsAnAuthenticatedUser {
  string user_id = 1;
}

// '"admin" has the bearer token "..."': declares a user by a token
// the scenario obtained some other way.
message HasBearerToken {
  string user_id = 1;

  string bearer_token = 2;
}

// '"bob" is an unauthenticated user': declares a user whose calls
// carry no token.
message IsAnUnauthenticatedUser {
  string user_id = 1;
}

// 'as "alice", a shared context'.
message SharedContext {
  // The user the shared context's calls are made as.
  string user = 1;
}

// '"alice" creates an `Account` of "alice" via `open` with ...', or
// '"alice" creates an `Account` via `open` with ...' for a state
// whose id the factory makes up.
message CreatesVia {
  // The state created; its id is empty when the factory makes it up.
  State state = 1;

  string method = 2;

  repeated Assignment assignments = 3;

  // The user the call is made as.
  string user = 4;
}

// '"alice" does a `deposit` on `Account` of "alice" with ...', or
// '"alice" spawns a `deposit` on `Account` of "alice" with ...' to
// run the call as a task.
message Does {
  State state = 1;

  string method = 2;

  repeated Assignment assignments = 3;

  // Whether the call is spawned as a task rather than done.
  bool spawned = 4;

  // The user the call is made as.
  string user = 5;
}

// '"alice" attempts a `withdraw` on `Account` of "alice" with ...'.
message Attempts {
  State state = 1;

  string method = 2;

  repeated Assignment assignments = 3;

  // The user the call is made as.
  string user = 4;
}

// '"alice" awaits the `deposit` task "<name>" on `Account` within 30
// seconds'.
message AwaitsTask {
  string method = 1;

  // The name the task's id was saved under.
  string task_id_saved_as = 2;

  string state_type = 3;

  double seconds = 4;

  // The user the call is made as.
  string user = 5;
}

// 'the attempt aborts with `OverdraftError` with ...'.
message AttemptAbortsWith {
  string error_type = 1;

  repeated Assertion assertions = 2;
}

// '`balance` on the `Account` for "alice" has ...': a reader, whose
// response is asserted on. A writer, transaction, or workflow is
// called with `Gets` and its result asserted with `ResultHas`.
message Has {
  string method = 1;

  State state = 2;

  repeated Assertion assertions = 3;

  // The user the call is made as.
  string user = 4;
}

// '`balance` on the `Account` for "alice" eventually has ... within
// 30 seconds': a reader, read reactively until its response
// satisfies the assertions or the bound passes.
message EventuallyHas {
  string method = 1;

  State state = 2;

  repeated Assertion assertions = 3;

  double seconds = 4;

  // The user the call is made as.
  string user = 5;
}

// '`get` on the `Account` for "alice" has `owner` saved as "o"': a
// reader, whose response is saved from.
message HasSavedAs {
  string method = 1;

  State state = 2;

  repeated Save saves = 3;

  // The user the call is made as.
  string user = 4;
}

// '`balance` on the `Account` for "alice" aborts with
// `OverdraftError` with ...': a reader that aborts. A writer,
// transaction, or workflow that aborts is called with `Attempts`
// and its abort asserted with `AttemptAbortsWith`.
message AbortsWith {
  string method = 1;

  State state = 2;

  string error_type = 3;

  repeated Assertion assertions = 4;

  // The user the call is made as.
  string user = 5;
}

// 'the result has ...'.
message ResultHas {
  repeated Assertion assertions = 1;
}

// An element of the web app a step names by what it is and what it
// says: 'the "Open Account" button'. The name is the element's
// accessible name as written, which may hold a <name> variable.
message Element {
  // What an element may be: the ARIA roles a step may name, each
  // written in a step as its name in lower case.
  enum Role {
    ROLE_UNSPECIFIED = 0;
    BUTTON = 1;
    LINK = 2;
    TAB = 3;
    CHECKBOX = 4;
    RADIO = 5;
    MENUITEM = 6;
    OPTION = 7;
    ROW = 8;
    TABLE = 9;
  }

  Role role = 1;

  string name = 2;
}

// '"alice" opens the web app', optionally 'at "/path"'.
message OpensWebApp {
  string user = 1;

  optional string path = 2;
}

// '"alice" clicks the "Open Account" button in the web app'.
message ClicksInWebApp {
  string user = 1;

  Element element = 2;
}

// '"alice" fills "Amount ($)" in the web app with `250`': the field
// named by its label.
message FillsInWebApp {
  string user = 1;

  string label = 2;

  Value value = 3;
}

// '"alice" selects "<id>" in "From Account" in the web app': the
// option, by its text, of the select named by its label.
message SelectsInWebApp {
  string user = 1;

  string option = 2;

  string label = 3;
}

// '"alice" checks "Remember me" in the web app', or unchecks.
message ChecksInWebApp {
  string user = 1;

  string label = 2;

  bool checked = 3;
}

// '"alice" presses "Enter" in the web app'.
message PressesInWebApp {
  string user = 1;

  string key = 2;
}

// '"alice" sees "$1000" in the web app', optionally 'in the "Your
// Accounts" table' before 'in the web app'; 'does not see' for the
// text's absence; 'eventually sees ... within 10 seconds' for text
// that arrives.
message SeesInWebApp {
  string user = 1;

  string text = 2;

  // The element the text is looked for in; absent for the page.
  optional Element within = 3;

  bool negated = 4;

  // Absent for a plain 'sees'.
  optional double seconds = 5;
}

// '"alice" sees the "Transfer Funds" button in the web app is
// disabled', or enabled.
message SeesEnabledInWebApp {
  string user = 1;

  Element element = 2;

  bool enabled = 3;
}

// '"alice" sees the web app at "/accounts"'.
message SeesWebAppAt {
  string user = 1;

  string path = 2;
}

// '"alice" saves the text of the "account-id" element in the web app
// as `account_id`': the element named by its test id.
message SavesTextInWebAppAs {
  string user = 1;

  string test_id = 2;

  string name = 3;
}

// '"alice" is signed in to the web app', optionally 'with their user
// id saved as "alice_user_id"': the browser's session is a signed-in
// user, whom "alice" calls as from here on.
message IsSignedInToWebApp {
  string user = 1;

  // The name the signed-in user's id is saved under, if any.
  optional string saved_as = 2;
}

// '"alice" is signed out of the web app': the browser's session is
// nobody, and "alice" calls with no token from here on.
message IsSignedOutOfWebApp {
  string user = 1;
}

// 'the resulting `account_id` is saved as "alice_account_id"'.
message ResultingIsSavedAs {
  Save save = 1;
}

// 'the resulting state id is saved as "account_id"': the id of the
// state the latest 'creates' step created.
message ResultingStateIdIsSavedAs {
  string name = 1;
}

// 'the resulting task id is saved as "deposit_task_id"': the id of
// the task the latest 'spawns' step spawned.
message ResultingTaskIdIsSavedAs {
  string name = 1;
}

// The syntax tree of a step's text under the grammar of the built-in
// `reboot.bdd` steps: which built-in step it is, and the parts the
// step takes. Only a text one of the built-in steps matches has one;
// a step an application defines itself does not.
message BuiltInSyntax {
  oneof step {
    ApplicationIsUp application_is_up = 1;
    IsAnAuthenticatedUser is_an_authenticated_user = 2;
    HasBearerToken has_bearer_token = 3;
    SharedContext shared_context = 4;
    CreatesVia creates_via = 5;
    Does does = 6;
    Attempts attempts = 7;
    AwaitsTask awaits_task = 8;
    AttemptAbortsWith attempt_aborts_with = 9;
    Has has = 10;
    EventuallyHas eventually_has = 11;
    HasSavedAs has_saved_as = 12;
    AbortsWith aborts_with = 13;
    ResultHas result_has = 14;
    ResultingIsSavedAs resulting_is_saved_as = 15;
    OpensWebApp opens_web_app = 16;
    ClicksInWebApp clicks_in_web_app = 17;
    FillsInWebApp fills_in_web_app = 18;
    SelectsInWebApp selects_in_web_app = 19;
    ChecksInWebApp checks_in_web_app = 20;
    PressesInWebApp presses_in_web_app = 21;
    SeesInWebApp sees_in_web_app = 22;
    SeesEnabledInWebApp sees_enabled_in_web_app = 23;
    SeesWebAppAt sees_web_app_at = 24;
    SavesTextInWebAppAs saves_text_in_web_app_as = 25;
    IsAnUnauthenticatedUser is_an_unauthenticated_user = 26;
    IsSignedInToWebApp is_signed_in_to_web_app = 27;
    IsSignedOutOfWebApp is_signed_out_of_web_app = 28;
    ResultingStateIdIsSavedAs resulting_state_id_is_saved_as = 29;
    ResultingTaskIdIsSavedAs resulting_task_id_is_saved_as = 30;
  }
}
