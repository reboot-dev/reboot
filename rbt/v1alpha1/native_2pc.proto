syntax = "proto3";

package rbt.v1alpha1;

// Isolated persistence and wire contract for the native two-phase commit
// protocol. It deliberately shares no records or services with the legacy
// transaction protocol.

// Every native record and request uses this exact protocol identity.
message Native2pcProtocol {
  // Must be exactly "reboot.native-2pc.v1".
  string protocol_id = 1;
  // Must be 1.
  uint32 record_version = 2;
}

// The complete identity of a Reboot actor.
message Native2pcActorId {
  string state_type = 1;
  string state_ref = 2;
}

// The enrolled participant and the digest binding the enrollment set.
message Native2pcEnrollment {
  Native2pcActorId participant = 1;
  bytes enrollment_digest = 2;
}

// Durable native coordinator state.
message Native2pcCoordinatorRecord {
  enum Phase {
    UNSPECIFIED = 0;
    PREPARING = 1;
    COMMIT_DECIDED = 2;
    ABORT_DECIDED = 3;
  }

  Native2pcProtocol protocol = 1;
  bytes root_transaction_id = 2;
  Native2pcActorId coordinator = 3;
  repeated Native2pcEnrollment enrollment = 4;
  bytes enrollment_digest = 5;
  Phase phase = 6;
}

// Opaque, native-v1 effects staged for one enrolled actor. These deliberately
// are not legacy Task or IdempotentMutation encodings. A later native actor
// runtime owns their interpretation; the sidecar owns their identity-bound
// durability and terminal publication.
message Native2pcEffect {
  // Nonempty native-v1 application key, canonical within its effect list.
  bytes key = 1;
  // Nonempty opaque native-v1 payload.
  bytes payload = 2;
}

message Native2pcActorEffects {
  // Presence distinguishes no state write from an intentional empty state.
  optional bytes state = 1;
  // Sorted, duplicate-free native-v1 effects.
  repeated Native2pcEffect effects = 2;
}

// Durable native participant state. STAGED is retained separately until an
// exact PREPARED transition consumes it; a terminal never manufactures state.
message Native2pcParticipantRecord {
  enum Phase {
    UNSPECIFIED = 0;
    ACTIVE = 1;
    PREPARED = 2;
    COMMITTED = 3;
    ABORTED = 4;
    STAGED = 5;
  }

  Native2pcProtocol protocol = 1;
  bytes root_transaction_id = 2;
  Native2pcActorId participant = 3;
  Native2pcActorId coordinator = 4;
  bytes enrollment_digest = 5;
  Phase phase = 6;
  Native2pcActorEffects effects = 7;
}

// The immutable effect journal published atomically with a COMMITTED terminal
// participant record and its identity-bound terminal receipt.
message Native2pcAppliedActorEffects {
  Native2pcProtocol protocol = 1;
  bytes root_transaction_id = 2;
  Native2pcActorId participant = 3;
  Native2pcActorId coordinator = 4;
  bytes enrollment_digest = 5;
  Native2pcActorEffects effects = 6;
}

// Capability negotiation is explicit and version-bound so native peers never
// infer support from the presence of a legacy transaction service.
message Native2pcCapabilitiesRequest {
  Native2pcProtocol required = 1;
}

message Native2pcCapabilitiesResponse {
  Native2pcProtocol accepted = 1;
  bool native_participant_enabled = 2;
  bool native_sidecar_enabled = 3;
}

// A prepare is bound to the complete participant and coordinator identities.
message Native2pcPrepareRequest {
  Native2pcProtocol protocol = 1;
  bytes root_transaction_id = 2;
  Native2pcActorId participant = 3;
  Native2pcActorId coordinator = 4;
  bytes enrollment_digest = 5;
}

message Native2pcPrepareResponse {
  enum Outcome {
    UNSPECIFIED = 0;
    PREPARED = 1;
    DEFINITIVE_ABORT = 2;
  }

  Outcome outcome = 1;
}

// A terminal decision is identity-bound; it cannot be applied by transaction
// id alone.
message Native2pcTerminalRequest {
  enum Decision {
    UNSPECIFIED = 0;
    COMMIT = 1;
    ABORT = 2;
  }

  Native2pcProtocol protocol = 1;
  bytes root_transaction_id = 2;
  Native2pcActorId participant = 3;
  Native2pcActorId coordinator = 4;
  bytes enrollment_digest = 5;
  Decision decision = 6;
}

message Native2pcTerminalResponse {
  // The participant phase durably stored for this identity-bound terminal
  // decision, including on a duplicate terminal request.
  Native2pcParticipantRecord.Phase terminal_phase = 1;
}

// Watch includes every identity component needed to bind the observed decision.
message Native2pcWatchRequest {
  Native2pcProtocol protocol = 1;
  bytes root_transaction_id = 2;
  Native2pcActorId coordinator = 3;
  Native2pcActorId participant = 4;
  bytes enrollment_digest = 5;
}

message Native2pcWatchResponse {
  Native2pcCoordinatorRecord.Phase phase = 1;
}

service Native2pcParticipant {
  rpc GetCapabilities(Native2pcCapabilitiesRequest)
      returns (Native2pcCapabilitiesResponse);
  rpc Prepare(Native2pcPrepareRequest) returns (Native2pcPrepareResponse);
  rpc Terminal(Native2pcTerminalRequest) returns (Native2pcTerminalResponse);
}

service Native2pcCoordinator {
  rpc Watch(Native2pcWatchRequest) returns (Native2pcWatchResponse);
}

// The native persistence surface is separate from the legacy Database service.
message Native2pcPutCoordinatorRequest {
  Native2pcCoordinatorRecord coordinator = 1;
}

message Native2pcPutCoordinatorResponse {}

// Participant persistence is explicit; terminal delivery never creates state.
message Native2pcPutParticipantRequest {
  Native2pcParticipantRecord participant = 1;
}

message Native2pcPutParticipantResponse {}

// Staging is a separate durable boundary. It requires a sealed PREPARING
// enrollment and is idempotent only for the exact same identity and effects.
message Native2pcStageParticipantRequest {
  Native2pcParticipantRecord participant = 1;
}

message Native2pcStageParticipantResponse {}

message Native2pcPutCommitDecisionRequest {
  Native2pcProtocol protocol = 1;
  bytes root_transaction_id = 2;
  Native2pcActorId coordinator = 3;
  bytes enrollment_digest = 4;
}

message Native2pcPutCommitDecisionResponse {}

message Native2pcPutAbortDecisionRequest {
  Native2pcProtocol protocol = 1;
  bytes root_transaction_id = 2;
  Native2pcActorId coordinator = 3;
  bytes enrollment_digest = 4;
}

message Native2pcPutAbortDecisionResponse {}

message Native2pcRecoverRequest {
  Native2pcProtocol protocol = 1;
}

message Native2pcRecoverResponse {
  Native2pcCoordinatorRecord coordinator = 1;
  Native2pcParticipantRecord participant = 2;
  // Immutable committed journal. It is redelivered until a future native actor
  // runtime durably materializes it; recovery never synthesizes it from p/.
  Native2pcAppliedActorEffects applied = 3;
}

message Native2pcTerminalParticipantRequest {
  Native2pcTerminalRequest terminal = 1;
}

message Native2pcTerminalParticipantResponse {
  Native2pcParticipantRecord.Phase terminal_phase = 1;
}

service Native2pcDatabase {
  rpc PutCoordinator(Native2pcPutCoordinatorRequest)
      returns (Native2pcPutCoordinatorResponse);
  rpc PutParticipant(Native2pcPutParticipantRequest)
      returns (Native2pcPutParticipantResponse);
  rpc StageParticipant(Native2pcStageParticipantRequest)
      returns (Native2pcStageParticipantResponse);
  rpc PutCommitDecision(Native2pcPutCommitDecisionRequest)
      returns (Native2pcPutCommitDecisionResponse);
  rpc PutAbortDecision(Native2pcPutAbortDecisionRequest)
      returns (Native2pcPutAbortDecisionResponse);
  rpc RecoverNative2pc(Native2pcRecoverRequest)
      returns (stream Native2pcRecoverResponse);
  rpc TerminalParticipant(Native2pcTerminalParticipantRequest)
      returns (Native2pcTerminalParticipantResponse);
}
