syntax = "proto3";

package rbt.v1alpha1.api;

import "rbt/v1alpha1/api/schema.proto";

// What one API file declares, as a grammar: the closed set of forms a
// pydantic `API(...)` or a `.proto` can take, which `rbt generate`
// prints proto from a pydantic API with and the dashboard describes
// either with. Every model a state type mentions is in `schemas`,
// and every enum in `enums`, by the name a `Reference` carries.

// Represents one API file: a pydantic file's `api = API(...)`, or
// what a `.proto` declares.
message API {
  // What a pydantic file alone declares.
  message Pydantic {
    // The Python module the file is, dotted, e.g. "shop.v1.shop":
    // what a `Reference` to a model of the file begins with, and what
    // generated code imports the models from.
    string module = 1;
  }

  // What a `.proto` alone declares: nothing yet.
  message Proto {}

  // The file, relative to the API directory, e.g. "shop/v1/shop.py"
  // or "shop/v1/shop.proto": what a pydantic file's `package` and
  // `module` are derived from.
  string filename = 1;

  // The package the file generates to, e.g. "shop.v1": a pydantic
  // file's directory, dotted, and a `.proto`'s `package`.
  string package = 2;

  // What was the module the file is, which only a pydantic file
  // is: now `Pydantic.module`.
  reserved 3;
  reserved "module";

  // In declaration order, which is the order they generate in.
  repeated StateType state_types = 4;

  // The models that are not state models, each listed once, in the
  // order they are described. For a `.proto`, every message the file
  // declares, in declaration order, and whatever those mention from
  // the files it imports, where first mentioned. For a pydantic
  // file, only what a state type mentions, which is how the models
  // are read: the requests, responses and errors of the methods, the
  // requests of the UIs, and anything those contain, however deeply
  // nested, where first met walking state type by state type; within
  // one, the state model's properties, then each UI's request, then
  // each method's request, response and errors; and a model's
  // properties, in declaration order, before the property after it.
  // That a pydantic file's other models are not described is a gap
  // to close.
  repeated Reference data_types = 5;

  // The schema of every model the state types mention, state models
  // included, by the name a `Reference` carries.
  map<string, Schema> schemas = 6;

  // Every enum the models mention, by the name a `Reference` carries.
  // Only a `.proto` declares any: a pydantic API spells a closed set
  // of strings as `Literals`. Every enum is a data type, so there is
  // no list of which are, the way `data_types` says which schemas.
  map<string, Enum> enums = 7;

  // Whether the file is declared outside the application's API.
  bool external = 11;

  // What the file was written as, which says how its author spells
  // what it declares: a `list[Item]` of a pydantic file is a
  // `repeated Item` of a `.proto`.
  oneof source {
    Pydantic pydantic = 9;
    Proto proto = 10;
  }
}

// Represents one `Type(...)` of the `API`.
message StateType {
  // The class name the developer gave it, e.g. "Shop".
  string name = 1;

  // The state model.
  Reference reference = 2;

  // What the state type does, in the author's own words.
  optional string description = 3;

  // Whether the state constructs itself for each user id.
  bool auto_construct = 4;

  // In declaration order.
  repeated Method methods = 5;

  // In declaration order.
  repeated UI uis = 6;
}

// Represents one `Reader(...)`, `Writer(...)`, `Transaction(...)` or
// `Workflow(...)` of a state type: what every kind declares, and,
// under `kind`, what its kind alone does.
message Method {
  string name = 1;

  // Which kind of method it is, with what that kind alone declares.
  oneof kind {
    Reader reader = 2;
    Writer writer = 3;
    Transaction transaction = 4;
    Workflow workflow = 5;
  }

  // Whether the method constructs the state.
  bool factory = 6;

  // Absent when the method takes or returns nothing.
  optional Reference request = 7;
  optional Reference response = 8;

  // The errors the method declares it raises, in declaration order.
  repeated Reference errors = 9;

  optional string description = 10;

  // How the method is exposed over MCP; absent when it is not.
  optional MCP mcp = 11;
}

// What a `Reader(...)` alone declares: nothing yet.
message Reader {}

// What a `Writer(...)` alone declares: nothing yet.
message Writer {}

// What a `Transaction(...)` alone declares.
message Transaction {
  // How the transaction holds the lock on its own state while it
  // runs, its `mode=`; each is what the same-named
  // `rbt.v1alpha1.TransactionMethodOptions` mode is.
  oneof mode {
    Exclusive exclusive = 1;
    Shared shared = 2;
  }
}

// What `Exclusive()` declares: nothing yet.
message Exclusive {}

// What `Shared()` declares: nothing yet.
message Shared {}

// What a `Workflow(...)` alone declares: nothing yet.
message Workflow {}

// Represents a method's `mcp=...`: how AI agents reach it over the
// Model Context Protocol.
message MCP {
  // Which of MCP's server primitives the method is exposed as.
  oneof primitive {
    Tool tool = 1;
    Resource resource = 2;
  }
}

// Represents a `Tool(...)`: a method exposed to AI agents as a tool.
message Tool {
  // The tool's name and title as an agent sees them; each absent
  // when the method's own name stands in.
  optional string name = 1;
  optional string title = 2;
}

// Represents a `Resource(...)`: a method exposed to AI agents as a
// resource. Declared by `reboot.api`, which does not yet accept one.
message Resource {
  optional string name = 1;
  optional string title = 2;
}

// Represents a `UI(...)` of a state type: a page the state type
// renders, whose request model is the page's props.
message UI {
  string name = 1;

  // The path the page is served at.
  string path = 2;

  // The page's props; absent for a page taking none.
  optional Reference request = 3;

  optional string title = 4;

  optional string description = 5;

  // Where the page's built artifact is; absent when unset.
  optional string artifact_path = 6;
}
